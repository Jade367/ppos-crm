    // ========== Products Page Component ==========
    const ProductsPage = ({ products, onUpdateProducts, showToast, onPriceRipple, allOrders, purchasedItems }) => {
        const [rippleReport, setRippleReport] = useState(null);
        const [search, setSearch] = useState('');
        const [catFilter, setCatFilter] = useState('all');
        const [modalOpen, setModalOpen] = useState(false);
        const [confirmDelete, setConfirmDelete] = useState(null); // { id, name, warnings }
        const [prodPage, setProdPage] = useState(1);
        const PROD_PAGE_SIZE = 15;
        const [editingProduct, setEditingProduct] = useState(null);
        const [form, setForm] = useState({
            sku: '', name: '', category: 'Food Box', material: 'White Card',
            cost: '', price: '', plateFee: '',
            pcsPerCarton: '', cartonLength: '', cartonWidth: '', cartonHeight: '',
            factoryName: '', currency: 'RMB', costNote: '',
            hsCode: '', materialComposition: '', netWeightPerCarton: '', grossWeightPerCarton: '',
        });
        const [showHistory, setShowHistory] = useState(false);
        const [errors, setErrors] = useState({});
        const firstInput = useRef(null);

        const filtered = useMemo(() => {
            let list = [...products];
            if (search.trim()) {
                const q = search.toLowerCase();
                list = list.filter(p =>
                    p.name.toLowerCase().includes(q) ||
                    p.sku.toLowerCase().includes(q) ||
                    (p.category || '').toLowerCase().includes(q)
                );
            }
            if (catFilter !== 'all') {
                list = list.filter(p => p.category === catFilter);
            }
            // Sort: by category order, then by sortOrder (custom), then by SKU
            list.sort((a, b) => {
                const ca = (CATEGORY_META[a.category] || {}).order || 99;
                const cb = (CATEGORY_META[b.category] || {}).order || 99;
                if (ca !== cb) return ca - cb;
                const sa = a.sortOrder ?? 9999;
                const sb = b.sortOrder ?? 9999;
                if (sa !== sb) return sa - sb;
                return (a.sku || '').localeCompare(b.sku || '');
            });
            return list;
        }, [products, search, catFilter]);

        // Drag-to-reorder: update sortOrder for affected products
        const reorderProduct = (fromId, toId) => {
            // Work on the current filtered+sorted list for visible order
            const sortedList = [...filtered];
            const fromIdx = sortedList.findIndex(p => p.id === fromId);
            const toIdx = sortedList.findIndex(p => p.id === toId);
            if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;
            const [moved] = sortedList.splice(fromIdx, 1);
            sortedList.splice(toIdx, 0, moved);
            // Assign new sortOrder to all items in the reordered list
            const orderMap = {};
            sortedList.forEach((p, i) => { orderMap[p.id] = i; });
            const updated = products.map(p => orderMap[p.id] !== undefined ? { ...p, sortOrder: orderMap[p.id] } : p);
            onUpdateProducts(updated);
            showToast('产品顺序已调整 Product order updated');
        };

        // Reset page when filter changes
        useEffect(() => { setProdPage(1); }, [search, catFilter]);

        const openAdd = () => {
            setEditingProduct(null);
            setForm({ sku: '', name: '', category: 'Food Box', material: 'White Card', cost: '', price: '', plateFee: '', pcsPerCarton: '', cartonLength: '', cartonWidth: '', cartonHeight: '', factoryName: '', currency: 'RMB', costNote: '', hsCode: '', materialComposition: '', netWeightPerCarton: '', grossWeightPerCarton: '' });
            setErrors({});
            setShowHistory(false);
            setModalOpen(true);
            setTimeout(() => firstInput.current?.focus(), 200);
        };

        const openEdit = (product) => {
            setEditingProduct(product);
            setForm({
                sku: product.sku || '',
                name: product.name || '',
                category: product.category || 'Food Box',
                material: product.material || 'White Card',
                cost: product.cost || '',
                price: product.price || '',
                plateFee: product.plateFee || '',
                pcsPerCarton: product.pcsPerCarton || '',
                cartonLength: product.cartonLength || '',
                cartonWidth: product.cartonWidth || '',
                cartonHeight: product.cartonHeight || '',
                factoryName: product.factoryName || '',
                currency: product.currency || 'RMB',
                costNote: '',
                hsCode: product.hsCode || '',
                materialComposition: product.materialComposition || '',
                netWeightPerCarton: product.netWeightPerCarton || '',
                grossWeightPerCarton: product.grossWeightPerCarton || '',
            });
            setErrors({});
            setShowHistory(false);
            setModalOpen(true);
            setTimeout(() => firstInput.current?.focus(), 200);
        };

        const update = (field, value) => {
            setForm(prev => ({ ...prev, [field]: value }));
            if (errors[field]) setErrors(prev => { const n = { ...prev }; delete n[field]; return n; });
        };

        const handleSave = () => {
            const errs = {};
            if (!form.sku.trim()) errs.sku = true;
            if (!form.name.trim()) errs.name = true;
            if (Object.keys(errs).length > 0) { setErrors(errs); return; }

            const newCost = parseFloat(form.cost) || 0;

            if (editingProduct) {
                // Update existing — push old cost to history if cost changed
                const updated = products.map(p => {
                    if (p.id !== editingProduct.id) return p;
                    const oldCost = p.cost || 0;
                    let updatedHistory = [...(p.costHistory || [])];
                    // If cost actually changed, log the new cost to history
                    if (newCost !== oldCost && newCost > 0) {
                        updatedHistory.push({
                            date: new Date().toISOString().slice(0, 10),
                            cost: newCost,
                            note: form.costNote.trim() || '',
                        });
                    }
                    return {
                        ...p,
                        sku: form.sku.trim().toUpperCase(),
                        name: form.name.trim(),
                        category: form.category,
                        material: form.material,
                        cost: newCost,
                        price: parseFloat(form.price) || 0,
                        plateFee: parseFloat(form.plateFee) || 0,
                        pcsPerCarton: parseInt(form.pcsPerCarton) || 0,
                        cartonLength: parseInt(form.cartonLength) || 0,
                        cartonWidth: parseInt(form.cartonWidth) || 0,
                        cartonHeight: parseInt(form.cartonHeight) || 0,
                        factoryName: form.factoryName.trim(),
                        currency: form.currency,
                        hsCode: form.hsCode.trim(),
                        materialComposition: form.materialComposition.trim(),
                        netWeightPerCarton: parseFloat(form.netWeightPerCarton) || 0,
                        grossWeightPerCarton: parseFloat(form.grossWeightPerCarton) || 0,
                        costHistory: updatedHistory,
                    };
                });
                onUpdateProducts(updated);
                const costChanged = newCost !== (editingProduct.cost || 0);
                // === PRICE RIPPLE EFFECT ===
                if (costChanged && newCost > 0 && onPriceRipple) {
                    const report = onPriceRipple(editingProduct.sku, editingProduct.cost || 0, newCost, editingProduct.name);
                    if (report) {
                        setRippleReport(report);
                        const parts = [];
                        if (report.ordersUpdated.length > 0) parts.push(`${report.ordersUpdated.length} orders updated`);
                        if (report.draftQuotesUpdated.length > 0) parts.push(`${report.draftQuotesUpdated.length} draft quotes updated`);
                        if (report.sentQuotesFlagged.length > 0) parts.push(`${report.sentQuotesFlagged.length} sent quotes flagged ⚠️`);
                        showToast(`💰 ${form.sku} cost updated! ${parts.join(', ')}`);
                    } else {
                        showToast(`${form.sku} 已更新 Updated! 成本已记录 Cost logged!`);
                    }
                } else {
                    showToast(`${form.sku} 已更新 Updated!${costChanged ? ' 成本已记录 Cost logged!' : ''}`);
                }
            } else {
                // Add new — initialize costHistory with the first cost entry
                const maxNum = products.reduce((max, p) => {
                    const n = parseInt(p.id.replace('P-', ''), 10);
                    return n > max ? n : max;
                }, 0);
                const newProduct = {
                    id: 'P-' + String(maxNum + 1).padStart(3, '0'),
                    sku: form.sku.trim().toUpperCase(),
                    name: form.name.trim(),
                    category: form.category,
                    material: form.material,
                    cost: newCost,
                    price: parseFloat(form.price) || 0,
                    plateFee: parseFloat(form.plateFee) || 0,
                    pcsPerCarton: parseInt(form.pcsPerCarton) || 0,
                    cartonLength: parseInt(form.cartonLength) || 0,
                    cartonWidth: parseInt(form.cartonWidth) || 0,
                    cartonHeight: parseInt(form.cartonHeight) || 0,
                    factoryName: form.factoryName.trim(),
                    factoryId: 'F-' + String(Date.now()).slice(-3),
                    currency: form.currency,
                    hsCode: form.hsCode.trim(),
                    materialComposition: form.materialComposition.trim(),
                    netWeightPerCarton: parseFloat(form.netWeightPerCarton) || 0,
                    grossWeightPerCarton: parseFloat(form.grossWeightPerCarton) || 0,
                    costHistory: newCost > 0 ? [{
                        date: new Date().toISOString().slice(0, 10),
                        cost: newCost,
                        note: form.costNote.trim() || '首次报价 Initial quote',
                    }] : [],
                };
                onUpdateProducts([...products, newProduct]);
                showToast(`${newProduct.sku} 已添加 Added!`);
            }
            setModalOpen(false);
        };

        const handleDelete = (productId) => {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            const warnings = [];
            // Check if product is referenced in any orders
            const orderRefs = [];
            Object.entries(allOrders || {}).forEach(([custId, orders]) => {
                (orders || []).forEach(order => {
                    if ((order.items || []).some(item => item.sku === product.sku || item.product === product.name)) {
                        orderRefs.push(order.id);
                    }
                });
            });
            if (orderRefs.length > 0) {
                warnings.push(`该产品被 ${orderRefs.length} 个订单引用: ${orderRefs.slice(0, 3).join(', ')}${orderRefs.length > 3 ? '...' : ''}`);
            }
            // Check if product is in any customer's purchased items
            let custRefCount = 0;
            Object.entries(purchasedItems || {}).forEach(([custId, items]) => {
                if ((items || []).some(item => item.sku === product.sku || item.product === product.name)) {
                    custRefCount++;
                }
            });
            if (custRefCount > 0) {
                warnings.push(`该产品出现在 ${custRefCount} 个客户的购买记录中`);
            }
            setConfirmDelete({ id: productId, name: product.name || product.sku, warnings });
        };

        const confirmDeleteProduct = () => {
            if (!confirmDelete) return;
            const updated = products.filter(p => p.id !== confirmDelete.id);
            onUpdateProducts(updated);
            showToast('产品已删除 Product deleted');
            setConfirmDelete(null);
        };

        // ESC to close modal
        useEffect(() => {
            const handler = (e) => { if (e.key === 'Escape' && modalOpen) setModalOpen(false); };
            document.addEventListener('keydown', handler);
            return () => document.removeEventListener('keydown', handler);
        }, [modalOpen]);

        const inputCls = (field) =>
            `w-full text-sm border rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#ff8b3d] focus:border-[#ff8b3d] ${
                errors[field] ? 'border-[#fc5466] bg-[#fc5466]/5' : 'border-gray-200 bg-white'
            }`;

        return (
            <div className="fade-in">
                {/* Stats row */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6 stat-cards-row">
                    <StatCard labelZh="产品总数" label="Total Products" value={products.length} sub={`${PRODUCT_CATEGORIES.length} categories`} />
                    <StatCard labelZh="平均毛利率" label="Avg Margin" value={(() => {
                        const margins = products.filter(p => p.price > 0).map(p => calcMargin(p.cost, p.price));
                        return margins.length > 0 ? `${(margins.reduce((s, m) => s + m, 0) / margins.length).toFixed(1)}%` : '-';
                    })()} color="text-green-600" />
                    <StatCard labelZh="低利润产品" label="Low Margin (<5%)" value={products.filter(p => calcMargin(p.cost, p.price) < 5 && p.price > 0).length} color="text-[#fc5466]" sub="Needs attention" />
                    <StatCard labelZh="供应商" label="Vendors" value={(() => {
                        const factories = new Set(products.map(p => p.factoryName).filter(Boolean));
                        return factories.size;
                    })()} sub={(() => {
                        const rising = products.filter(p => {
                            const h = p.costHistory || [];
                            if (h.length < 2) return false;
                            return h[h.length - 1].cost > h[h.length - 2].cost;
                        }).length;
                        return rising > 0 ? `${rising} price rising ⚠️` : 'All stable ✓';
                    })()} color={(() => {
                        const rising = products.filter(p => {
                            const h = p.costHistory || [];
                            if (h.length < 2) return false;
                            return h[h.length - 1].cost > h[h.length - 2].cost;
                        }).length;
                        return rising > 0 ? 'text-[#fc5466]' : 'text-green-500';
                    })()} />
                </div>

                {/* Price Ripple Report (appears after a cost change triggers ripple) */}
                <PriceRipplePanel report={rippleReport} onDismiss={() => setRippleReport(null)} />

                {/* Table card */}
                <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                    {/* Toolbar */}
                    <div className="px-3 md:px-5 py-3 border-b border-gray-100 flex items-center justify-between gap-2 md:gap-4 table-toolbar">
                        <div className="flex items-center gap-2 md:gap-3 min-w-0">
                            <h2 className="text-xs md:text-sm font-semibold text-[#233749] whitespace-nowrap">产品主数据<span className="hidden md:inline"> Product Master</span></h2>
                            <span className="text-[10px] md:text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full whitespace-nowrap">{filtered.length} items</span>
                        </div>
                        <div className="flex items-center gap-2">
                            {/* Search */}
                            <div className="relative">
                                <svg className="w-4 h-4 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                                <input
                                    type="text"
                                    value={search}
                                    onChange={e => setSearch(e.target.value)}
                                    placeholder="搜索SKU/名称 Search..."
                                    className="pl-8 pr-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#ff8b3d] focus:border-[#ff8b3d] w-32 md:w-48"
                                />
                            </div>
                            {/* Category filter */}
                            <select
                                value={catFilter}
                                onChange={e => setCatFilter(e.target.value)}
                                className="text-xs border border-gray-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#ff8b3d] text-gray-600 bg-white hidden md:block"
                            >
                                <option value="all">全部分类 All</option>
                                {PRODUCT_CATEGORIES.map(cat => (
                                    <option key={cat} value={cat}>{CATEGORY_META[cat]?.label || cat}</option>
                                ))}
                            </select>
                            {/* Add button */}
                            <button
                                onClick={openAdd}
                                className="bg-[#ff8b3d] hover:bg-[#e67a30] text-white text-xs font-medium px-2.5 md:px-4 py-2 rounded-lg transition-colors flex items-center gap-1 md:gap-1.5 shadow-sm"
                            >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/>
                                </svg>
                                <span className="hidden md:inline">Add Product</span>
                            </button>
                        </div>
                    </div>

                    {/* Table */}
                    <div className="overflow-x-auto">
                        <table className="w-full">
                            <thead>
                                <tr className="bg-gray-50 border-b border-gray-100">
                                    <th className="py-2.5 pl-4 pr-2 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left w-[72px]">SKU</th>
                                    <th className="py-2.5 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider text-left">产品名称 Product</th>
                                    <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-center mobile-hide">供应商 Vendor</th>
                                    <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right">成本 Cost</th>
                                    <th className="py-2.5 px-2 text-xs font-semibold text-gray-500 uppercase tracking-wider text-center mobile-hide">趋势 Trend</th>
                                    <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right mobile-hide">售价 Price</th>
                                    <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-center mobile-hide">毛利 Margin</th>
                                    <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right mobile-hide">版费 Plate</th>
                                    <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-center mobile-hide">装箱</th>
                                    <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right mobile-hide">CBM/1000pcs</th>
                                    <th className="py-2.5 px-3 w-16"></th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.length === 0 ? (
                                    <tr>
                                        <td colSpan="11" className="py-12 text-center text-gray-400 text-sm">
                                            暂无产品 No products found
                                        </td>
                                    </tr>
                                ) : (
                                    filtered.slice((prodPage - 1) * PROD_PAGE_SIZE, prodPage * PROD_PAGE_SIZE).map(p => {
                                        const cbmPer1000 = calcCBMPer1000(p);
                                        const catMeta = CATEGORY_META[p.category] || CATEGORY_META['Food Box'];
                                        return (
                                            <tr key={p.id} className="table-row border-b border-gray-50 group" draggable="true" onDragStart={e => { e.dataTransfer.setData('text/plain', p.id); e.dataTransfer.effectAllowed = 'move'; e.currentTarget.classList.add('opacity-40'); }} onDragEnd={e => { e.currentTarget.classList.remove('opacity-40'); }} onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('bg-[#ff8b3d]/5'); }} onDragLeave={e => { e.currentTarget.classList.remove('bg-[#ff8b3d]/5'); }} onDrop={e => { e.preventDefault(); e.currentTarget.classList.remove('bg-[#ff8b3d]/5'); const fromId = e.dataTransfer.getData('text/plain'); if (fromId && fromId !== p.id) reorderProduct(fromId, p.id); }}>
                                                <td className="py-3 pl-4 pr-2">
                                                    <span className="font-mono text-[11px] text-[#ff8b3d] bg-[#ff8b3d]/5 px-1.5 py-0.5 rounded ring-1 ring-[#ff8b3d]/30 whitespace-nowrap">{p.sku}</span>
                                                </td>
                                                <td className="py-3 px-4">
                                                    <div className="text-sm font-medium text-[#233749]">{p.name}</div>
                                                    <div className="flex items-center gap-2 mt-0.5">
                                                        <span className={`inline-flex items-center px-1.5 py-0 rounded-full text-[9px] font-medium ring-1 ${catMeta.cls}`}>
                                                            {catMeta.label || p.category}
                                                        </span>
                                                        {p.pcsPerCarton > 0 && (
                                                            <span className="text-[9px] text-gray-400">
                                                                {p.cartonLength}×{p.cartonWidth}×{p.cartonHeight}mm
                                                            </span>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="py-3 px-3 text-center mobile-hide">
                                                    {p.factoryName ? (
                                                        <div>
                                                            <div className="text-[11px] font-medium text-[#233749]/90">{p.factoryName}</div>
                                                            <div className="text-[9px] text-gray-400">{p.currency || 'RMB'}</div>
                                                        </div>
                                                    ) : (
                                                        <span className="text-[10px] text-gray-300">—</span>
                                                    )}
                                                </td>
                                                <td className="py-3 px-3 text-right text-sm text-gray-600">¥{(p.cost || 0).toFixed(2)}</td>
                                                <td className="py-3 px-2 text-center mobile-hide">
                                                    <PriceSparkline costHistory={p.costHistory} width={80} height={28} />
                                                </td>
                                                <td className="py-3 px-3 text-right text-sm font-bold text-[#233749] mobile-hide">¥{(p.price || 0).toFixed(2)}</td>
                                                <td className="py-3 px-3 text-center mobile-hide">
                                                    <MarginBadge cost={p.cost} price={p.price} />
                                                </td>
                                                <td className="py-3 px-3 text-right text-xs text-gray-500 mobile-hide">
                                                    {p.plateFee > 0 ? `¥${p.plateFee.toLocaleString()}` : <span className="text-gray-300">—</span>}
                                                </td>
                                                <td className="py-3 px-3 text-center text-[10px] text-gray-500 mobile-hide">
                                                    {p.pcsPerCarton > 0 ? `${p.pcsPerCarton} pcs/ctn` : <span className="text-gray-300">—</span>}
                                                </td>
                                                <td className="py-3 px-3 text-right mobile-hide">
                                                    {cbmPer1000 > 0 ? (
                                                        <span className="text-xs font-mono font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded ring-1 ring-blue-200">
                                                            {cbmPer1000.toFixed(4)}
                                                        </span>
                                                    ) : (
                                                        <span className="text-xs text-gray-300">—</span>
                                                    )}
                                                </td>
                                                <td className="py-3 px-2">
                                                    <div className="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button
                                                            onClick={() => openEdit(p)}
                                                            className="text-gray-400 hover:text-[#ff8b3d] p-1 rounded transition-colors"
                                                            title="编辑 Edit"
                                                        >
                                                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                                            </svg>
                                                        </button>
                                                        <button
                                                            onClick={() => handleDelete(p.id)}
                                                            className="text-gray-300 hover:text-[#fc5466] p-1 rounded transition-colors"
                                                            title="删除 Delete"
                                                        >
                                                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Footer with Pagination */}
                    <div className="px-5 py-2.5 border-t border-gray-100 bg-[#fcf6fa]/50 flex items-center justify-between">
                        <span className="text-xs text-gray-400">
                            共 {filtered.length} 项产品 · 第 {prodPage}/{Math.ceil(filtered.length / PROD_PAGE_SIZE) || 1} 页
                        </span>
                        <Pagination total={filtered.length} pageSize={PROD_PAGE_SIZE} currentPage={prodPage} onPageChange={(p) => setProdPage(p)} />
                    </div>
                </div>

                {/* ===== Add/Edit Product Modal ===== */}
                {modalOpen && (
                    <>
                        <div className="fixed inset-0 bg-black/40 z-50" onClick={() => setModalOpen(false)} />
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col fade-in" onClick={e => e.stopPropagation()}>
                                {/* Modal header */}
                                <div className="bg-[#233749] px-6 py-4 rounded-t-2xl flex items-center justify-between shrink-0">
                                    <div>
                                        <h3 className="text-base font-bold text-white">
                                            {editingProduct ? '编辑产品 Edit Product' : '新增产品 Add New Product'}
                                        </h3>
                                        <p className="text-xs text-white/70 mt-0.5">填写产品信息和包装参数 Product details & packaging</p>
                                    </div>
                                    <button onClick={() => setModalOpen(false)} className="text-white/70 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                                        </svg>
                                    </button>
                                </div>

                                {/* Modal body */}
                                <div className="flex-1 overflow-y-auto px-6 py-5 space-y-4">
                                    {/* Row 1: SKU + Name */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">SKU <span className="text-[#fc5466]/70">*</span></label>
                                            <input ref={firstInput} type="text" value={form.sku} onChange={e => update('sku', e.target.value)}
                                                className={inputCls('sku') + ' font-mono uppercase'} placeholder="BOX-CK-005" />
                                            {errors.sku && <p className="text-[10px] text-[#fc5466] mt-0.5">SKU required</p>}
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">产品名称 Name <span className="text-[#fc5466]/70">*</span></label>
                                            <input type="text" value={form.name} onChange={e => update('name', e.target.value)}
                                                className={inputCls('name')} placeholder="5号炸鸡盒 / 1080ML" />
                                            {errors.name && <p className="text-[10px] text-[#fc5466] mt-0.5">Name required</p>}
                                        </div>

                                                <option value="USD">$ USD 美元</option>
                                                <option value="AUD">A$ AUD 澳元</option>

                                    <div className="border-t border-gray-100 pt-4">
                                        <span className="text-xs font-semibold text-gray-500"><Icon name="wallet" size={14} className="inline mr-1" /> 价格信息 Pricing</span>

                                    {/* Row 3: Cost + Price + Plate Fee */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">
                                                成本 Unit Cost (¥)
                                                {editingProduct && editingProduct.cost > 0 && parseFloat(form.cost) !== editingProduct.cost && parseFloat(form.cost) > 0 && (
                                                    <span className="ml-1 text-[10px] text-[#ff8b3d] font-normal"><Icon name="zap" size={10} className="inline mr-0.5" /> Cost changed! Will be logged</span>
                                                )}
                                            </label>
                                            <input type="number" step="0.01" value={form.cost} onChange={e => update('cost', e.target.value)}
                                                className={inputCls('cost') + ' text-right'} placeholder="0.32" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">售价 Sell Price (¥)</label>
                                            <input type="number" step="0.01" value={form.price} onChange={e => update('price', e.target.value)}
                                                className={inputCls('price') + ' text-right'} placeholder="0.44" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">版费 Plate Fee (¥)</label>
                                            <input type="number" step="1" value={form.plateFee} onChange={e => update('plateFee', e.target.value)}
                                                className={inputCls('plateFee') + ' text-right'} placeholder="800" />
                                        </div>
                                    </div>

                                    {/* Cost change note (only show when editing & cost changed) */}
                                    {editingProduct && parseFloat(form.cost) !== (editingProduct.cost || 0) && parseFloat(form.cost) > 0 && (
                                        <div className="bg-[#ff8b3d]/5 rounded-lg px-4 py-2.5 border border-[#ff8b3d]/30">
                                            <label className="block text-[10px] font-semibold text-[#ff8b3d] mb-1"><Icon name="edit" size={10} className="inline mr-0.5" /> 价格变动备注 Price Change Note (optional)</label>
                                            <input type="text" value={form.costNote} onChange={e => update('costNote', e.target.value)}
                                                className="w-full text-xs border border-[#ff8b3d]/30 rounded px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#ff8b3d] bg-white"
                                                placeholder="e.g., 原料涨价 Raw material increase" />
                                        </div>
                                    )}

                                    {/* Live margin preview */}
                                    {form.cost && form.price && parseFloat(form.price) > 0 && (
                                        <div className="flex items-center gap-3 bg-gray-50 rounded-lg px-4 py-2">
                                            <span className="text-xs text-gray-500">毛利预览 Margin Preview:</span>
                                            <MarginBadge cost={parseFloat(form.cost) || 0} price={parseFloat(form.price) || 0} />
                                            <span className="text-xs text-gray-400">
                                                (¥{((parseFloat(form.price) || 0) - (parseFloat(form.cost) || 0)).toFixed(2)} / unit)
                                            </span>
                                        </div>
                                    )}

                                    {/* Price History Section (only when editing a product with history) */}
                                    {editingProduct && (editingProduct.costHistory || []).length > 0 && (
                                        <div className="border-t border-gray-100 pt-3">
                                            <button
                                                onClick={() => setShowHistory(!showHistory)}
                                                className="flex items-center gap-2 text-xs font-semibold text-gray-500 hover:text-[#ff8b3d] transition-colors w-full"
                                            >
                                                <span>{showHistory ? '▾' : '▸'}</span>
                                                <span><Icon name="chart-up" size={12} className="inline mr-0.5" /> 历史报价 Price History ({editingProduct.costHistory.length} records)</span>
                                            </button>
                                            {showHistory && (
                                                <div className="mt-3">
                                                    <PriceHistoryPanel costHistory={editingProduct.costHistory} productName={editingProduct.name} />
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <div className="border-t border-gray-100 pt-4">
                                        <span className="text-xs font-semibold text-gray-500"><Icon name="package" size={14} className="inline mr-1" /> 包装参数 Packaging</span>
                                    </div>

                                    {/* Row 4: Packing info */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">每箱数量 Pcs/Ctn</label>
                                            <input type="number" value={form.pcsPerCarton} onChange={e => update('pcsPerCarton', e.target.value)}
                                                className={inputCls('pcsPerCarton') + ' text-center'} placeholder="500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">长 L (mm)</label>
                                            <input type="number" value={form.cartonLength} onChange={e => update('cartonLength', e.target.value)}
                                                className={inputCls('cartonLength') + ' text-center'} placeholder="530" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">宽 W (mm)</label>
                                            <input type="number" value={form.cartonWidth} onChange={e => update('cartonWidth', e.target.value)}
                                                className={inputCls('cartonWidth') + ' text-center'} placeholder="430" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">高 H (mm)</label>
                                            <input type="number" value={form.cartonHeight} onChange={e => update('cartonHeight', e.target.value)}
                                                className={inputCls('cartonHeight') + ' text-center'} placeholder="350" />
                                        </div>
                                    </div>

                                    {/* Live CBM preview */}
                                    {form.pcsPerCarton && form.cartonLength && form.cartonWidth && form.cartonHeight && (
                                        <div className="flex items-center gap-4 bg-blue-50 rounded-lg px-4 py-2">
                                            <span className="text-xs text-blue-600 font-medium"><Icon name="package" size={13} className="inline mr-0.5" /> CBM Preview:</span>
                                            <span className="text-xs text-blue-700">
                                                CBM/carton: <span className="font-bold">{((parseInt(form.cartonLength) * parseInt(form.cartonWidth) * parseInt(form.cartonHeight)) / 1e9).toFixed(4)} m³</span>
                                            </span>
                                            <span className="text-blue-300">|</span>
                                            <span className="text-xs text-blue-700">
                                                CBM/1000pcs: <span className="font-bold">{calcCBMPer1000({
                                                    pcsPerCarton: parseInt(form.pcsPerCarton),
                                                    cartonLength: parseInt(form.cartonLength),
                                                    cartonWidth: parseInt(form.cartonWidth),
                                                    cartonHeight: parseInt(form.cartonHeight),
                                                }).toFixed(4)} m³</span>
                                            </span>
                                        </div>
                                    )}

                                    {/* Customs / Export fields */}
                                    <div className="border-t border-gray-100 pt-4">
                                        <span className="text-xs font-semibold text-gray-500"><Icon name="customs" size={14} className="inline mr-1" /> 报关信息 Customs / Export</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">海关编码 HS Code</label>
                                            <input type="text" value={form.hsCode} onChange={e => update('hsCode', e.target.value)}
                                                className={inputCls('hsCode') + ' font-mono'} placeholder="4819.10.00" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">材质成分 Material Comp.</label>
                                            <input type="text" value={form.materialComposition} onChange={e => update('materialComposition', e.target.value)}
                                                className={inputCls('materialComposition')} placeholder="White Cardboard 350gsm" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">净重/箱 N.W./Ctn (kg)</label>
                                            <input type="number" step="0.1" value={form.netWeightPerCarton} onChange={e => update('netWeightPerCarton', e.target.value)}
                                                className={inputCls('netWeightPerCarton') + ' text-right'} placeholder="8.5" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">毛重/箱 G.W./Ctn (kg)</label>
                                            <input type="number" step="0.1" value={form.grossWeightPerCarton} onChange={e => update('grossWeightPerCarton', e.target.value)}
                                                className={inputCls('grossWeightPerCarton') + ' text-right'} placeholder="9.2" />
                                        </div>
                                    </div>
                                </div>

                                {/* Modal footer */}
                                <div className="px-6 py-4 border-t border-gray-200 shrink-0 bg-gray-50 rounded-b-2xl flex gap-3">
                                    <button onClick={() => setModalOpen(false)}
                                        className="text-sm font-medium text-gray-600 bg-white border border-gray-200 rounded-xl py-2.5 px-5 hover:bg-[#fcf6fa] transition-colors">
                                        取消 Cancel
                                    </button>
                                    <button onClick={handleSave}
                                        className="flex-1 text-sm font-bold text-white bg-[#ff8b3d] rounded-xl py-2.5 hover:bg-[#e67a30] transition-colors flex items-center justify-center gap-1.5">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/>
                                        </svg>
                                        {editingProduct ? '更新 Update' : '保存 Save'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </>
                )}

                {/* Delete Confirmation */}
                <ConfirmDialog
                    open={!!confirmDelete}
                    title="确认删除产品 Delete Product"
                    message={confirmDelete ? `确定要删除 "${confirmDelete.name}" 吗？此操作不可撤销。` : ''}
                    warnings={confirmDelete?.warnings || []}
                    onConfirm={confirmDeleteProduct}
                    onCancel={() => setConfirmDelete(null)}
                />
            </div>
        );
    };

    // ========== Chart.js React Wrapper ==========
    const ChartCanvas = ({ type, data, options, height = 250 }) => {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);

        useEffect(() => {
            if (!canvasRef.current) return;
            if (chartRef.current) chartRef.current.destroy();
            chartRef.current = new Chart(canvasRef.current, { type, data, options: { ...options, responsive: true, maintainAspectRatio: false } });
            return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [type, data, options]);

        return <div style={{ height }}><canvas ref={canvasRef} /></div>;
    };

    // ========== Reports Dashboard Page ==========
    const ReportsPage = ({ customers, allOrders, products, purchasedItems, quoteHistory }) => {
        const [dateRange, setDateRange] = useState('all');

        // ===== Flatten all orders =====
        const allOrdersFlat = useMemo(() => {
            const flat = [];
            Object.entries(allOrders || {}).forEach(([customerId, orders]) => {
                const customer = customers.find(c => c.id === customerId);
                (orders || []).forEach(order => {
                    flat.push({ ...order, customerId, customerName: customer ? (customer.companyZh || customer.company) : customerId });
                });
            });
            return flat;
        }, [allOrders, customers]);

        // ===== Date filtering =====
        const filteredOrders = useMemo(() => {
            if (dateRange === 'all') return allOrdersFlat;
            const now = new Date();
            let cutoff;
            if (dateRange === '30d') cutoff = new Date(now.getTime() - 30 * 86400000);
            else if (dateRange === '90d') cutoff = new Date(now.getTime() - 90 * 86400000);
            else if (dateRange === 'ytd') cutoff = new Date(now.getFullYear(), 0, 1);
            else return allOrdersFlat;
            return allOrdersFlat.filter(o => new Date(o.date) >= cutoff);
        }, [allOrdersFlat, dateRange]);

        // ===== SECTION 1: Financial KPIs =====
        const financials = useMemo(() => {
            let totalRevenue = 0, totalCost = 0, totalPlateFees = 0, totalShipping = 0;
            const productMap = {};
            (products || []).forEach(p => { productMap[p.sku] = p; });

            filteredOrders.forEach(order => {
                const orderRev = order.totalAmount || order.items.reduce((s, i) => s + i.qty * i.unitPrice, 0);
                totalRevenue += orderRev;
                order.items.forEach(item => {
                    const prod = productMap[item.sku];
                    const cost = prod ? prod.cost : item.unitPrice * 0.7;
                    totalCost += cost * item.qty;
                });
                totalShipping += orderRev * 0.05; // estimate 5% shipping
            });

            (products || []).forEach(p => { totalPlateFees += p.plateFee || 0; });

            const netProfit = totalRevenue - totalCost - totalShipping;
            const avgMargin = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100) : 0;

            return { totalRevenue, totalCost, totalShipping, totalPlateFees, netProfit, avgMargin };
        }, [filteredOrders, products]);

        // Revenue over time (by month)
        const revenueByMonth = useMemo(() => {
            const months = {};
            filteredOrders.forEach(order => {
                const m = order.date.slice(0, 7); // YYYY-MM
                if (!months[m]) months[m] = { revenue: 0, profit: 0 };
                const rev = order.totalAmount || order.items.reduce((s, i) => s + i.qty * i.unitPrice, 0);
                months[m].revenue += rev;
                months[m].profit += rev * (financials.avgMargin / 100);
            });
            const sorted = Object.entries(months).sort((a, b) => a[0].localeCompare(b[0]));
            return {
                labels: sorted.map(([m]) => m),
                revenues: sorted.map(([, v]) => v.revenue),
                profits: sorted.map(([, v]) => v.profit),
            };
        }, [filteredOrders, financials.avgMargin]);

        // Area chart data
        const areaChartData = useMemo(() => ({
            labels: revenueByMonth.labels,
            datasets: [
                {
                    label: '营收 Revenue',
                    data: revenueByMonth.revenues,
                    borderColor: '#ff8b3d',
                    backgroundColor: 'rgba(249,115,22,0.1)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 2,
                },
                {
                    label: '净利润 Net Profit',
                    data: revenueByMonth.profits,
                    borderColor: '#22c55e',
                    backgroundColor: 'rgba(34,197,94,0.08)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 2,
                },
            ],
        }), [revenueByMonth]);

        const areaChartOptions = useMemo(() => ({
            plugins: {
                legend: { position: 'top', labels: { font: { size: 11 }, usePointStyle: true, boxWidth: 8 } },
                tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ¥${ctx.parsed.y.toLocaleString('en', { minimumFractionDigits: 0 })}` } },
            },
            scales: {
                y: { ticks: { callback: (v) => `¥${(v / 1000).toFixed(0)}k`, font: { size: 10 } }, grid: { color: '#f3f4f6' } },
                x: { ticks: { font: { size: 10 } }, grid: { display: false } },
            },
        }), []);

        // Donut chart data
        const donutChartData = useMemo(() => ({
            labels: ['产品成本 Product Cost', '运费 Shipping', '版费 Plate Fees'],
            datasets: [{
                data: [financials.totalCost, financials.totalShipping, financials.totalPlateFees],
                backgroundColor: ['#ff8b3d', '#3b82f6', '#a855f7'],
                borderWidth: 0,
                hoverOffset: 6,
            }],
        }), [financials]);

        const donutChartOptions = useMemo(() => ({
            cutout: '65%',
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 10 }, usePointStyle: true, boxWidth: 8, padding: 12 } },
                tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ¥${ctx.parsed.toLocaleString('en', { minimumFractionDigits: 0 })}` } },
            },
        }), []);

        // ===== SECTION 2: Customer Rankings =====
        const customerRankings = useMemo(() => {
            const customerStats = {};
            const productMap = {};
            (products || []).forEach(p => { productMap[p.sku] = p; });

            allOrdersFlat.forEach(order => {
                if (!customerStats[order.customerId]) {
                    customerStats[order.customerId] = { name: order.customerName, revenue: 0, cost: 0, profit: 0 };
                }
                const rev = order.totalAmount || order.items.reduce((s, i) => s + i.qty * i.unitPrice, 0);
                let cost = 0;
                order.items.forEach(item => {
                    const prod = productMap[item.sku];
                    cost += (prod ? prod.cost : item.unitPrice * 0.7) * item.qty;
                });
                customerStats[order.customerId].revenue += rev;
                customerStats[order.customerId].cost += cost;
                customerStats[order.customerId].profit += rev - cost;
            });

            return Object.entries(customerStats)
                .map(([id, s]) => ({ id, ...s, margin: s.revenue > 0 ? (s.profit / s.revenue * 100) : 0 }))
                .sort((a, b) => b.profit - a.profit)
                .slice(0, 10);
        }, [allOrdersFlat, products]);

        // Churn risk (>60 days inactive + high value)
        const churnRisk = useMemo(() => {
            return customers
                .filter(c => {
                    const days = daysSince(c.lastActiveDate || c.lastOrder);
                    return days > 60 && c.totalRevenue > 30000;
                })
                .sort((a, b) => b.totalRevenue - a.totalRevenue)
                .slice(0, 5);
        }, [customers]);

        // ===== SECTION 3: Accounts Receivable =====
        const arData = useMemo(() => {
            let ar0to30 = 0, ar31to60 = 0, ar60plus = 0, totalOutstanding = 0;
            allOrdersFlat.forEach(order => {
                if (order.paymentStatus === 'fully_paid' || order.stage === 'Delivered') return;
                const due = order.balanceAmount || (order.totalAmount ? order.totalAmount * 0.7 : 0);
                if (due <= 0) return;
                const days = daysSince(order.date);
                totalOutstanding += due;
                if (days <= 30) ar0to30 += due;
                else if (days <= 60) ar31to60 += due;
                else ar60plus += due;
            });
            return { ar0to30, ar31to60, ar60plus, totalOutstanding };
        }, [allOrdersFlat]);

        const arChartData = useMemo(() => ({
            labels: ['应收账款 Accounts Receivable'],
            datasets: [
                { label: '1-30天', data: [arData.ar0to30], backgroundColor: '#22c55e', borderRadius: 4 },
                { label: '31-60天', data: [arData.ar31to60], backgroundColor: '#f59e0b', borderRadius: 4 },
                { label: '60+天', data: [arData.ar60plus], backgroundColor: '#fc5466', borderRadius: 4 },
            ],
        }), [arData]);

        const arChartOptions = useMemo(() => ({
            indexAxis: 'y',
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 10 }, usePointStyle: true, boxWidth: 8 } },
                tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ¥${ctx.parsed.x.toLocaleString('en', { minimumFractionDigits: 0 })}` } },
            },
            scales: {
                x: { stacked: true, ticks: { callback: (v) => `¥${(v / 1000).toFixed(0)}k`, font: { size: 10 } }, grid: { color: '#f3f4f6' } },
                y: { stacked: true, display: false },
            },
        }), []);

        // ===== SECTION 4: Product Intelligence =====
        const topSellers = useMemo(() => {
            const skuSales = {};
            allOrdersFlat.forEach(order => {
                order.items.forEach(item => {
                    const key = item.sku || item.product;
                    if (!skuSales[key]) skuSales[key] = { sku: item.sku, name: item.product, qty: 0, revenue: 0 };
                    skuSales[key].qty += item.qty;
                    skuSales[key].revenue += item.qty * item.unitPrice;
                });
            });
            return Object.values(skuSales).sort((a, b) => b.qty - a.qty).slice(0, 5);
        }, [allOrdersFlat]);

        const unpaidPlateFees = useMemo(() => {
            let total = 0;
            let count = 0;
            Object.values(purchasedItems || {}).forEach(items => {
                (items || []).forEach(item => {
                    if (item.plateFee === 'unpaid') { total += 800; count++; } // estimate per plate
                });
            });
            // Also from products
            const fromProducts = (products || []).filter(p => p.plateFee > 0).reduce((s, p) => s + p.plateFee, 0);
            return { total: total || fromProducts, count: count || (products || []).filter(p => p.plateFee > 0).length };
        }, [purchasedItems, products]);

        const topSellerChartData = useMemo(() => ({
            labels: topSellers.map(s => s.name.length > 12 ? s.name.slice(0, 12) + '...' : s.name),
            datasets: [{
                label: '销量 Qty Sold',
                data: topSellers.map(s => s.qty),
                backgroundColor: ['#ff8b3d', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7'],
                borderRadius: 6,
                borderWidth: 0,
            }],
        }), [topSellers]);

        const topSellerChartOptions = useMemo(() => ({
            indexAxis: 'y',
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.x.toLocaleString()} pcs` } },
            },
            scales: {
                x: { ticks: { callback: (v) => `${(v / 1000).toFixed(0)}k`, font: { size: 10 } }, grid: { color: '#f3f4f6' } },
                y: { ticks: { font: { size: 10 } }, grid: { display: false } },
            },
        }), []);

        return (
            <div className="fade-in space-y-5">
                {/* Date Range Picker */}
                <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                        {[
                            { key: 'all', label: '全部 All Time' },
                            { key: '30d', label: '近30天 Last 30 Days' },
                            { key: '90d', label: '近季度 Last Quarter' },
                            { key: 'ytd', label: '今年 YTD' },
                        ].map(r => (
                            <button

        taxRate: 0,
        currency: '¥',
        marginAlertLow: 5,
        marginAlertHigh: 15,
    };

    // ========== Settings Page ==========
    const SettingsPage = ({ showToast, onHardReset, onExportJSON, onImportJSON, onExportCSV, onImportCSV, onDownloadCSVTemplate, fileInputRef, companyProfile, onUpdateCompanyProfile, authUser, onImportProfitStatement, factories }) => {
        const [activeSection, setActiveSection] = useState('general');
        const [settings, setSettings] = useState(() => loadFromStorage(STORAGE_KEYS.settings, DEFAULT_SETTINGS));
        const [saved, setSaved] = useState(false);
        const [resetModalOpen, setResetModalOpen] = useState(false);
        const [resetConfirmText, setResetConfirmText] = useState('');
        const [recycleBinData, setRecycleBinData] = useState(null);
        const [recycleBinLoading, setRecycleBinLoading] = useState(false);
        const csvFileRef = useRef(null);
        const [csvImportType, setCsvImportType] = useState('customers');
        const [migrating, setMigrating] = useState(false);

        // Team management state
        const isAdmin = authUser?.role === 'admin';
        const [teamMembers, setTeamMembers] = useState([]);
        const [teamLoading, setTeamLoading] = useState(false);
        const [showAddMember, setShowAddMember] = useState(false);
        const [newMember, setNewMember] = useState({ username: '', password: '', displayName: '', role: 'sales', linkedFactoryId: '' });
        const [addingMember, setAddingMember] = useState(false);
        const [editingRole, setEditingRole] = useState(null); // userId being edited

        const update = (field, value) => {
            setSettings(prev => ({ ...prev, [field]: value }));
            setSaved(false);
        };

        const handleSave = () => {
            saveToStorage(STORAGE_KEYS.settings, settings);
            setSaved(true);
            showToast('✅ 设置已保存 Settings saved!');
            setTimeout(() => setSaved(false), 2000);
        };

        const handleHardReset = () => {
            if (resetConfirmText !== 'DELETE') return;
            setResetModalOpen(false);
            setResetConfirmText('');
            // Clear all localStorage
            Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
            showToast('🗑️ 所有数据已清除 All data deleted!');
            setTimeout(() => window.location.reload(), 800);
        };

        // Team management functions
        const loadTeamMembers = async () => {
            setTeamLoading(true);
            try {
                const members = await db.profiles.list();
                setTeamMembers(members);
            } catch (err) {
                console.error('[PPOS] Load team error:', err);
                showToast('加载团队失败 Failed to load team');
            }
            setTeamLoading(false);
        };

        const handleAddMember = async () => {
            const { username, password, displayName, role, linkedFactoryId } = newMember;
            if (!username.trim() || !password || password.length < 6) {
                showToast('请填写用户名和密码（至少6位）Username and password (min 6 chars) required');
                return;
            }
            // Validate username: only letters, numbers, underscore, dash
            const uname = username.trim().toLowerCase().replace(/\s+/g, '_');
            if (!/^[a-z0-9_\-]+$/.test(uname)) {
                showToast('用户名只能包含字母、数字、下划线 Username: letters, numbers, _ only');
                return;
            }
            setAddingMember(true);
            const { error } = await createTeamMember(uname, password, displayName.trim() || uname, role, linkedFactoryId);
            if (error) {
                showToast('创建失败 Failed: ' + error.message);
            } else {
                showToast(`账号已创建! 登录名: ${uname}  密码: ${password}`);
                setNewMember({ username: '', password: '', displayName: '', role: 'sales', linkedFactoryId: '' });
                setShowAddMember(false);
                await loadTeamMembers();
            }
            setAddingMember(false);
        };

        const handleChangeRole = async (userId, newRole) => {
            try {
                await db.profiles.updateRole(userId, newRole);
                setTeamMembers(prev => prev.map(m => m.id === userId ? { ...m, role: newRole } : m));
                setEditingRole(null);
                showToast('角色已更新 Role updated!');
            } catch (err) {
                showToast('更新失败 Update failed: ' + err.message);
            }
        };

        const sections = [
            { key: 'general', label: '基本信息 General', icon: 'building' },
            ...(isAdmin ? [{ key: 'team', label: '团队管理 Team', icon: 'users' }] : []),
            { key: 'finance', label: '财务设置 Finance', icon: 'wallet' },
            { key: 'data', label: '数据管理 Data', icon: 'save' },
            { key: 'recycle', label: '回收站 Recycle Bin', icon: 'trash' },
        ];

        const loadRecycleBin = async () => {
            setRecycleBinLoading(true);
            try {
                const data = await db.recycleBin.listAll();
                setRecycleBinData(data);
            } catch (err) {
                console.error('[PPOS] Load recycle bin error:', err);
                showToast('加载回收站失败 Failed to load recycle bin');
            }
            setRecycleBinLoading(false);
        };

        const handleRestore = async (table, id, label) => {
            try {
                await db.recycleBin.restoreItem(table, id);
                showToast(`已恢复 Restored: ${label}`);
                loadRecycleBin(); // refresh
            } catch (err) {
                showToast('恢复失败 Restore failed: ' + err.message);
            }
        };

        const handlePermanentDelete = async (table, id, label) => {
            if (!confirm(`确定要永久删除 "${label}" 吗？此操作不可撤销。\nPermanently delete "${label}"? This cannot be undone.`)) return;
            try {
                await db.recycleBin.hardDeleteItem(table, id);
                showToast(`已永久删除 Permanently deleted: ${label}`);
                loadRecycleBin();
            } catch (err) {
                showToast('删除失败 Delete failed: ' + err.message);
            }
        };

        // Migrate localStorage data to Supabase
        const migrateFromLocalStorage = async () => {
            setMigrating(true);
            try {
                const oldKeys = {
                    customers: 'pp_crm_customers', purchasedItems: 'pp_crm_purchased_items',
                    quoteHistory: 'pp_crm_quote_history', orders: 'pp_crm_orders',
                    products: 'pp_crm_products', factories: 'ppos_factories',
                    materials: 'ppos_materials', priceImpacts: 'pp_crm_price_impacts',
                    companyProfile: 'pp_crm_company_profile',
                };
                let totalMigrated = 0;

                // Customers
                const rawCust = localStorage.getItem(oldKeys.customers);
                if (rawCust) {
                    const custs = JSON.parse(rawCust);
                    for (const c of custs) {
                        try { await db.customers.insert(c); totalMigrated++; } catch { try { await db.customers.update(c.id, c); totalMigrated++; } catch(e2) { console.warn('Skip customer:', c.id); } }
                    }
                }

                // Products
                const rawProd = localStorage.getItem(oldKeys.products);
                if (rawProd) {
                    const prods = JSON.parse(rawProd);
                    for (const p of prods) {
                        try { await db.products.insert(p); totalMigrated++; } catch { try { await db.products.update(p.id, p); totalMigrated++; } catch(e2) { console.warn('Skip product:', p.id); } }
                    }
                }

                // Purchased Items
                const rawPI = localStorage.getItem(oldKeys.purchasedItems);
                if (rawPI) {
                    const piObj = JSON.parse(rawPI);
                    for (const [custId, items] of Object.entries(piObj)) {
                        for (const item of (items || [])) {
                            try { await db.purchasedItems.insert({ ...item, customerId: custId }); totalMigrated++; } catch(e) { console.warn('Skip PI:', e); }
                        }
                    }
                }

                // Quotes
                const rawQ = localStorage.getItem(oldKeys.quoteHistory);
                if (rawQ) {
                    const qObj = JSON.parse(rawQ);
                    for (const [custId, quotes] of Object.entries(qObj)) {
                        for (const q of (quotes || [])) {
                            try { await db.quotes.insert({ ...q, customerId: custId }); totalMigrated++; } catch(e) { console.warn('Skip quote:', e); }
                        }
                    }
                }

                // Orders
                const rawOrd = localStorage.getItem(oldKeys.orders);
                if (rawOrd) {
                    const ordObj = JSON.parse(rawOrd);
                    for (const [custId, orders] of Object.entries(ordObj)) {
                        for (const o of (orders || [])) {
                            try { await db.orders.insert({ ...o, customerId: custId }); totalMigrated++; } catch { try { await db.orders.update(o.id, { ...o, customerId: custId }); totalMigrated++; } catch(e2) { console.warn('Skip order:', o.id); } }
                        }
                    }
                }

                // Factories
                const rawFact = localStorage.getItem(oldKeys.factories);
                if (rawFact) {
                    const facts = JSON.parse(rawFact);
                    for (const f of facts) {
                        try { await db.factories.insert(f); totalMigrated++; } catch { try { await db.factories.update(f.id, f); totalMigrated++; } catch(e2) { console.warn('Skip factory:', f.id); } }
                    }
                }

                // Materials

                }

    // ========== Boss Dashboard (Home Page) ==========
    const BossDashboard = ({ customers, allOrders, products, purchasedItems, quoteHistory, showToast, onNav }) => {
        const {
            AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
            PieChart, Pie, Cell, Legend
        } = window.Recharts || {};

        // ---- Flatten orders ----
        const allFlat = useMemo(() => {
            const flat = [];
            Object.entries(allOrders || {}).forEach(([customerId, orders]) => {
                const cust = customers.find(c => c.id === customerId);
                (orders || []).forEach(o => flat.push({ ...o, customerId, customerName: cust ? (cust.companyZh || cust.company) : customerId }));
            });
            return flat;
        }, [allOrders, customers]);

        // ---- KPI calculations ----
        const totalRevenue = useMemo(() => allFlat.reduce((s, o) => s + (o.totalAmount || 0), 0), [allFlat]);
        // Real net profit: sum of (unitPrice - cost) * qty for each order item
        const netProfit = useMemo(() => {
            let profit = 0;
            allFlat.forEach(o => {
                (o.items || []).forEach(item => {
                    const prod = (products || []).find(p => p.sku === item.sku);
                    const cost = item.cost || (prod ? prod.cost : 0) || 0;
                    const revenue = (item.unitPrice || 0) * (item.qty || 0);
                    const costTotal = cost * (item.qty || 0);
                    profit += (revenue - costTotal);
                });
            });
            return +profit.toFixed(2);
        }, [allFlat, products]);
        const profitMargin = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100).toFixed(1) : '0.0';
        const totalDue = useMemo(() => allFlat.filter(o => o.paymentStatus !== 'fully_paid').reduce((s, o) => s + (o.balanceAmount || 0), 0), [allFlat]);
        const activeOrderCount = useMemo(() => allFlat.filter(o => ['Production', 'Ex_Factory', 'In_Transit'].includes(o.stage)).length, [allFlat]);

        // ---- Trend chart data (real monthly from orders) ----
        const trendData = useMemo(() => {
            const monthMap = {}; // { '2026-01': { revenue, cost } }
            allFlat.forEach(o => {
                if (!o.date) return;
                const ym = o.date.slice(0, 7); // '2026-02'
                if (!monthMap[ym]) monthMap[ym] = { revenue: 0, profit: 0 };
                const orderRevenue = o.totalAmount || 0;
                let orderCost = 0;
                (o.items || []).forEach(item => {
                    const prod = (products || []).find(p => p.sku === item.sku);
                    const cost = item.cost || (prod ? prod.cost : 0) || 0;
                    orderCost += cost * (item.qty || 0);
                });
                monthMap[ym].revenue += orderRevenue;
                monthMap[ym].profit += (orderRevenue - orderCost);
            });
            const sorted = Object.entries(monthMap).sort((a, b) => a[0].localeCompare(b[0]));
            if (sorted.length === 0) return [{ month: new Date().toISOString().slice(0, 7), revenue: 0, profit: 0 }];
            return sorted.map(([ym, d]) => ({
                month: ym.slice(5) + '月', // '02月'
                revenue: +d.revenue.toFixed(0),
                profit: +d.profit.toFixed(0),
            }));
        }, [allFlat, products]);

        // ---- Category distribution ----
        const categoryData = useMemo(() => {
            const catMap = {};
            allFlat.forEach(order => {
                (order.items || []).forEach(item => {
                    const prod = (products || []).find(p => p.sku === item.sku);
                    const cat = prod ? prod.category : 'Other';
                    catMap[cat] = (catMap[cat] || 0) + item.qty * item.unitPrice;
                });
            });
            return Object.entries(catMap).map(([name, value]) => ({ name, value: +value.toFixed(0) }));
        }, [allFlat, products]);

        const DONUT_COLORS = ['#ff8b3d', '#3b82f6', '#10b981', '#a855f7', '#f43f5e', '#6366f1'];

        // ---- Overdue payments list ----
        const overduePayments = useMemo(() => {
            const now = new Date();
            return allFlat
                .filter(o => o.paymentStatus !== 'fully_paid' && o.balanceAmount > 0)
                .map(o => {
                    const orderDate = new Date(o.date);
                    const daysOverdue = Math.floor((now - orderDate) / 86400000);
                    return { ...o, daysOverdue };

                .filter(o => o.daysOverdue > 14)
                .sort((a, b) => b.daysOverdue - a.daysOverdue);
        }, [allFlat]);

        // ---- Operational alerts ----
        const opAlerts = useMemo(() => {
            const alerts = [];
            // Unpaid deposit orders
            allFlat.filter(o => o.stage === 'Order_Placed' && o.paymentStatus === 'unpaid').forEach(o => {

            });
            // Orders estimated past due
            const now = new Date();
            allFlat.filter(o => o.estimatedCompletionDate && new Date(o.estimatedCompletionDate) < now && o.stage !== 'Delivered').forEach(o => {
                alerts.push({ type: 'overdue', icon: 'circle-dot', label: `交期已过 Past ETA`, detail: `${o.id} · ETA was ${o.estimatedCompletionDate}`, color: 'text-amber-600' });
            });
            // Churn-risk customers
            customers.filter(c => {
                const d = c.lastActiveDate || c.lastOrder;
                return d && (now - new Date(d)) / 86400000 > 45;
            }).forEach(c => {
                alerts.push({ type: 'churn', icon: 'alert-triangle', label: `流失预警 Churn Risk`, detail: `${c.companyZh || c.company}`, color: 'text-[#ff8b3d]' });

            // Plate fees to check (orders with items that have plateFee > 0)
            allFlat.filter(o => o.stage === 'Order_Placed').forEach(o => {

        return (

                    <KpiCard icon="circle-alert" iconBg="bg-[#fc5466]/5" labelZh="应收账款" label="Total Due (AR)"

                    <KpiCard icon="package" iconBg="bg-blue-50" labelZh="活跃订单" label="Active Orders"

                {/* ---- Charts Row ---- */}

                                        <button onClick={() => copyReminder(o)}

                                            <Icon name="clipboard" size={13} />

                    {/* Operational Alerts */}
                    <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">

    };
