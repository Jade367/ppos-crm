    // ========== Order Tracking Card ==========
    // ========== Export Document Generators (Commercial Invoice & Packing List) ==========
    const generateExportDoc = async (order, customer, products, docType = 'invoice') => {
        const isInvoice = docType === 'invoice';
        const orderNum = order.id;
        const companyName = customer?.companyZh || customer?.company || 'Customer';
        const companyEn = customer?.company || '';
        const invoiceNo = `INV-${orderNum.replace('ORD-', '')}`;
        const packingNo = `PL-${orderNum.replace('ORD-', '')}`;
        const docNo = isInvoice ? invoiceNo : packingNo;

        // Build product lookup by SKU
        const productMap = {};
        (products || []).forEach(p => { productMap[p.sku] = p; });

        let subtotal = 0;
        let totalCartons = 0, totalNW = 0, totalGW = 0, totalCBM = 0;

        const rows = order.items.map((item, idx) => {
            const prod = productMap[item.sku] || {};
            const amount = item.qty * item.unitPrice;
            subtotal += amount;

            const pcsPerCtn = prod.pcsPerCarton || 0;
            const cartons = pcsPerCtn > 0 ? Math.ceil(item.qty / pcsPerCtn) : 0;
            const nw = cartons * (prod.netWeightPerCarton || 0);
            const gw = cartons * (prod.grossWeightPerCarton || 0);
            const cbmPerCtn = (prod.cartonLength && prod.cartonWidth && prod.cartonHeight)
                ? (prod.cartonLength * prod.cartonWidth * prod.cartonHeight) / 1e9 : 0;
            const cbm = cartons * cbmPerCtn;

            totalCartons += cartons;
            totalNW += nw;
            totalGW += gw;
            totalCBM += cbm;

            if (isInvoice) {
                // Commercial Invoice row
                return `<tr>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;font-size:12px;color:#333;">${item.product}${prod.materialComposition ? '<br/><span style="color:#888;font-size:10px;">' + prod.materialComposition + '</span>' : ''}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;font-size:11px;color:#666;text-align:center;font-family:monospace;">${prod.hsCode || '-'}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;font-size:12px;color:#555;text-align:right;">${item.qty.toLocaleString()}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;font-size:12px;color:#555;text-align:right;">¥${item.unitPrice.toFixed(2)}</td>
                    <td style="padding:8px 10px;border-bottom:1px solid #e5e7eb;font-size:12px;color:#333;text-align:right;font-weight:600;">¥${amount.toLocaleString('en', { minimumFractionDigits: 2 })}</td>
                </tr>`;
            } else {
                // Packing List row (no prices)
                const rowBg = idx % 2 === 1 ? 'background:#fafafa;' : '';
                return `<tr style="${rowBg}">
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:10.5px;color:#999;text-align:center;">${idx + 1}</td>
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#222;font-weight:500;">${item.product}${prod.materialComposition ? '<br/><span style="color:#aaa;font-size:9.5px;font-weight:400;">' + prod.materialComposition + '</span>' : ''}</td>
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:10.5px;color:#555;text-align:center;font-family:monospace;letter-spacing:0.5px;">${prod.hsCode || '—'}</td>
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#444;text-align:right;">${item.qty.toLocaleString()}</td>
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#444;text-align:right;">${cartons > 0 ? cartons : '—'}</td>
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#555;text-align:right;">${nw > 0 ? nw.toFixed(1) : '—'}</td>
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#555;text-align:right;">${gw > 0 ? gw.toFixed(1) : '—'}</td>
                    <td style="padding:6px 8px;border-bottom:1px solid #f0f0f0;font-size:11px;color:#444;text-align:right;font-weight:500;">${cbm > 0 ? cbm.toFixed(4) : '—'}</td>
                </tr>`;
            }
        }).join('');

        const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

        const invoiceHeaders = `
            <th style="padding:10px;font-size:11px;color:#fff;text-align:left;font-weight:600;">Description of Goods</th>
            <th style="padding:10px;font-size:11px;color:#fff;text-align:center;font-weight:600;">HS Code</th>
            <th style="padding:10px;font-size:11px;color:#fff;text-align:right;font-weight:600;">Qty (Pcs)</th>
            <th style="padding:10px;font-size:11px;color:#fff;text-align:right;font-weight:600;">Unit Price</th>
            <th style="padding:10px;font-size:11px;color:#fff;text-align:right;font-weight:600;">Amount</th>`;

        const packingHeaders = `
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:left;font-weight:600;white-space:nowrap;">标记<br/><span style="font-weight:400;opacity:0.75;">Marks</span></th>
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:left;font-weight:600;">品名描述<br/><span style="font-weight:400;opacity:0.75;">Description</span></th>
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:center;font-weight:600;white-space:nowrap;">海关编号<br/><span style="font-weight:400;opacity:0.75;">HS Code</span></th>
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:right;font-weight:600;white-space:nowrap;">数量<br/><span style="font-weight:400;opacity:0.75;">Qty (Pcs)</span></th>
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:right;font-weight:600;white-space:nowrap;">箱数<br/><span style="font-weight:400;opacity:0.75;">Ctns</span></th>
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:right;font-weight:600;white-space:nowrap;">净重<br/><span style="font-weight:400;opacity:0.75;">N.W.(kg)</span></th>
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:right;font-weight:600;white-space:nowrap;">毛重<br/><span style="font-weight:400;opacity:0.75;">G.W.(kg)</span></th>
            <th style="padding:8px 8px;font-size:10px;color:#fff;text-align:right;font-weight:600;white-space:nowrap;">体积<br/><span style="font-weight:400;opacity:0.75;">CBM(m³)</span></th>`;

        const summarySection = isInvoice ? `
            <div style="display:flex;justify-content:flex-end;margin-bottom:24px;">
                <table style="font-size:13px;border-collapse:collapse;min-width:240px;">
                    <tr><td style="padding:5px 16px 5px 0;color:#999;text-align:right;">Subtotal:</td><td style="font-weight:600;text-align:right;">¥${subtotal.toLocaleString('en', { minimumFractionDigits: 2 })}</td></tr>
                    <tr style="border-top:2px solid #e5e7eb;"><td style="padding:8px 16px 5px 0;color:#333;font-weight:700;text-align:right;font-size:14px;">Total:</td><td style="font-weight:800;text-align:right;font-size:15px;">¥${subtotal.toLocaleString('en', { minimumFractionDigits: 2 })}</td></tr>
                </table>
            </div>` : `
            <div style="margin-bottom:20px;border-top:2px solid #1a1a1a;padding-top:10px;display:flex;justify-content:flex-end;">

                        <td style="padding:7px 14px;color:#333;font-weight:700;text-align:right;border:1px solid #ebebeb;">净重 N.W.<br/><span style="font-size:13px;color:#1a1a1a;">${totalNW.toFixed(1)} kg</span></td>
                        <td style="padding:7px 14px;color:#333;font-weight:700;text-align:right;border:1px solid #ebebeb;">毛重 G.W.<br/><span style="font-size:13px;color:#1a1a1a;">${totalGW.toFixed(1)} kg</span></td>
                        <td style="padding:7px 14px;color:#333;font-weight:700;text-align:right;border:1px solid #ebebeb;">体积 CBM<br/><span style="font-size:13px;color:#1a1a1a;">${totalCBM.toFixed(4)} m³</span></td>
                    </tr>
                </table>
            </div>`;

        const html = `
        <div id="pdf-export" style="width:760px;padding:45px 45px 35px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#fff;color:#333;">
            <!-- Header -->
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;border-bottom:3px solid #1a1a1a;padding-bottom:20px;">
                <div>
                    <div style="font-size:10px;color:#ff8b3d;font-weight:700;letter-spacing:2px;">POCKET PACKET</div>
                    <div style="font-size:10px;color:#999;margin-top:2px;">口袋包装</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:28px;font-weight:300;color:#333;letter-spacing:1px;">${isInvoice ? 'Commercial Invoice' : 'Packing List'}</div>
                    <div style="font-size:13px;color:#999;margin-top:3px;">${isInvoice ? '商业发票' : '装箱单'}</div>
                </div>
            </div>

            <!-- Info Block -->
            <div style="display:flex;justify-content:space-between;margin-bottom:28px;">
                <div>
                    <table style="font-size:12px;border-collapse:collapse;">
                        <tr><td style="padding:3px 12px 3px 0;color:#999;">To / 买方:</td><td style="font-weight:600;">${companyName} ${companyEn !== companyName ? companyEn : ''}</td></tr>
                        <tr><td style="padding:3px 12px 3px 0;color:#999;">Address:</td><td>${customer?.address || '-'}</td></tr>
                    </table>
                </div>
                <div style="text-align:right;">
                    <table style="font-size:12px;border-collapse:collapse;margin-left:auto;">
                        <tr><td style="padding:3px 12px 3px 0;color:#999;text-align:right;">Doc No.:</td><td style="font-weight:600;text-align:right;">${docNo}</td></tr>
                        <tr><td style="padding:3px 12px 3px 0;color:#999;text-align:right;">Date:</td><td style="text-align:right;">${today}</td></tr>
                        <tr><td style="padding:3px 12px 3px 0;color:#999;text-align:right;">Order Ref.:</td><td style="text-align:right;">${orderNum}</td></tr>
                    </table>
                </div>
            </div>

            <!-- Items Table -->
            <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <thead>
                    <tr style="background:#1a1a1a;">${isInvoice ? invoiceHeaders : packingHeaders}</tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>

            ${summarySection}

            <!-- Footer -->
            <div style="border-top:1px solid #e8e8e8;padding-top:12px;display:flex;justify-content:space-between;align-items:flex-end;">
                <div style="font-size:10.5px;color:#777;line-height:1.7;">
                    <div><span style="color:#bbb;">原产地 Country of Origin：</span><strong style="color:#444;">中国 China</strong></div>
                    <div><span style="color:#bbb;">贸易术语 Trade Terms：</span><strong style="color:#444;">FOB 上海 Shanghai</strong></div>
                    ${!isInvoice ? '<div style="margin-top:3px;"><span style="color:#bbb;">总箱数 Total Ctns：</span><strong style="color:#444;">' + totalCartons + '</strong><span style="color:#bbb;margin:0 8px;">·</span><span style="color:#bbb;">总毛重 G.W.：</span><strong style="color:#444;">' + totalGW.toFixed(1) + ' kg</strong><span style="color:#bbb;margin:0 8px;">·</span><span style="color:#bbb;">总体积 CBM：</span><strong style="color:#444;">' + totalCBM.toFixed(4) + ' m³</strong></div>' : ''}
                </div>
                <div style="text-align:right;font-size:9.5px;color:#ccc;letter-spacing:0.5px;">
                    <div style="font-weight:600;letter-spacing:1.5px;">POCKET PACKET</div>
                    <div>www.pocketpacket.com.au</div>
                </div>
            </div>
        </div>`;

        // Render to PDF
        const container = document.createElement('div');
        container.innerHTML = html;
        container.style.position = 'fixed';
        container.style.left = '-9999px';
        container.style.top = '0';
        document.body.appendChild(container);

        try {
            const canvas = await html2canvas(container.querySelector('#pdf-export'), {
                scale: 2, useCORS: true, backgroundColor: '#ffffff',
            });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfW = pdf.internal.pageSize.getWidth();
            const pdfH = (canvas.height * pdfW) / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, pdfW, pdfH);
            const filename = isInvoice
                ? `CommercialInvoice_${docNo}_${companyEn.replace(/\s+/g, '_')}.pdf`
                : `PackingList_${docNo}_${companyEn.replace(/\s+/g, '_')}.pdf`;
            pdf.save(filename);
            return true;
        } catch (err) {
            console.error('Export doc PDF failed:', err);
            return false;
        } finally {
            document.body.removeChild(container);
        }
    };

    const OrderTrackingCard = ({ order, customerName, onAdvanceStage, onRevertStage, onRecordDeposit, onRecordFullPayment, onGenerateInvoice, onGeneratePackingList, factories, onAssignFactory, onEditOrder, onUpdateOrders, allOrdersForCustomer, showToast }) => {
        const currentIdx = ORDER_STAGE_KEYS.indexOf(order.stage);
        const currentMeta = ORDER_STAGE_META[order.stage] || ORDER_STAGES[0];
        const nextStage = currentIdx < ORDER_STAGE_KEYS.length - 1 ? ORDER_STAGE_KEYS[currentIdx + 1] : null;
        const totalAmount = order.totalAmount || order.items.reduce((s, i) => s + i.qty * i.unitPrice, 0);

        // Payment records state (local to this card)
        const [payInput, setPayInput] = React.useState('');
        const [payNote, setPayNote] = React.useState('');

        return (
            <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden fade-in hover:shadow-md transition-shadow">
                {/* Card Header */}
                <div className="px-3 md:px-5 py-3 md:py-3.5 border-b border-gray-100 flex items-center justify-between gap-2 bg-gradient-to-r from-[#fcf6fa]/50 to-white flex-wrap">
                    <div className="flex items-center gap-2 md:gap-3 min-w-0 flex-wrap">
                        <span className="text-xs md:text-sm font-mono font-semibold text-[#233749]">{order.id}</span>
                        {customerName && (
                            <span className="text-[10px] md:text-xs text-gray-500 bg-gray-100 px-1.5 md:px-2 py-0.5 rounded-md truncate max-w-[120px] md:max-w-none">{customerName}</span>
                        )}
                        <span className="text-[10px] md:text-xs text-gray-400">{order.date}</span>
                    </div>
                    <span className={`inline-flex items-center gap-1 md:gap-1.5 px-2 md:px-3 py-1 rounded-full text-[10px] md:text-[11px] font-bold ring-1 shrink-0 ${currentMeta.color}`}>
                        <Icon name={currentMeta.icon} size={13} className="inline mr-0.5" /> {currentMeta.label} {currentMeta.labelEn}
                    </span>
                </div>

                {/* Visual Stepper */}
                <div className="px-3 md:px-6 py-3 md:py-5 border-b border-gray-50 bg-white">
                    <OrderStepper currentStage={order.stage} />
                </div>

                {/* Production ETA */}
                {order.estimatedCompletionDate && order.stage !== 'Delivered' && (
                    <div className="px-5 py-2 border-b border-gray-50 bg-blue-50/40 flex items-center gap-2">
                        <svg className="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <span className="text-[11px] text-blue-700 font-medium">预计完成 Est. Completion: <span className="font-bold">{order.estimatedCompletionDate}</span></span>
                    </div>
                )}

                {/* Financial Info + Payment Records Panel */}
                {(() => {
                    const total = totalAmount;
                    const stdDeposit = Math.round(total * 0.3 * 100) / 100;
                    const ps = order.paymentStatus || 'unpaid';
                    const paymentRecords = (order.costSnapshot && order.costSnapshot._paymentRecords) || [];
                    const totalPaid = ps === 'fully_paid' ? total : paymentRecords.reduce((s, r) => s + (r.amount || 0), 0);
                    const remaining = Math.max(0, Math.round((total - totalPaid) * 100) / 100);
                    const paidPct = total > 0 ? (totalPaid / total * 100) : 0;
                    const stdDepositReached = totalPaid >= stdDeposit;
                    const gapToStd = Math.max(0, stdDeposit - totalPaid);
                    const isUnderStd = !stdDepositReached && ps !== 'fully_paid';
                    const statusColor = ps === 'fully_paid' ? '#16a34a' : totalPaid > 0 ? '#d97706' : '#fc5466';
                    const statusLabel = ps === 'fully_paid' ? '已结清 Fully Paid' : totalPaid > 0 ? `已收 ${paidPct.toFixed(1)}%` : '未付款 Unpaid';
                    const isDirty = payInput !== '' && parseFloat(payInput) > 0;

                    return (
                        <div className="px-5 py-3 border-b border-gray-100">
                            {/* Header row: order value + status badge */}
                            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>
                                <span style={{fontSize:'11px',color:'#888',fontWeight:600}}>
                                    <Icon name="wallet" size={12} className="inline mr-1" />
                                    收款记录 Payment Records
                                </span>
                                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                                    <span style={{fontSize:'12px',fontWeight:700,color:'#ff8b3d'}}>¥{total.toLocaleString('en',{minimumFractionDigits:2})}</span>
                                    <span style={{fontSize:'10px',fontWeight:700,color:statusColor,background:statusColor+'15',padding:'2px 8px',borderRadius:'20px',border:`1px solid ${statusColor}40`}}>
                                        {statusLabel}
                                    </span>
                                </div>
                            </div>

                            {/* Summary: Total / Paid / Due */}
                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px',marginBottom:'10px'}}>
                                <div style={{background:'#f9fafb',borderRadius:'8px',padding:'7px 8px',border:'1px solid #ebebeb',textAlign:'center'}}>
                                    <div style={{fontSize:'8.5px',color:'#aaa',marginBottom:'2px'}}>合同总额 Total</div>
                                    <div style={{fontSize:'12px',fontWeight:700,color:'#ff8b3d'}}>¥{total.toLocaleString('en',{minimumFractionDigits:2})}</div>
                                </div>
                                <div style={{background:'#f9fafb',borderRadius:'8px',padding:'7px 8px',border:`1px solid ${totalPaid>0?'#16a34a30':'#ebebeb'}`,textAlign:'center'}}>
                                    <div style={{fontSize:'8.5px',color:'#aaa',marginBottom:'2px'}}>已收 Received</div>
                                    <div style={{fontSize:'12px',fontWeight:700,color:totalPaid>0?'#16a34a':'#999'}}>¥{totalPaid.toLocaleString('en',{minimumFractionDigits:2})}</div>
                                    <div style={{fontSize:'8px',color:'#aaa'}}>{paidPct.toFixed(1)}%</div>
                                </div>
                                <div style={{background:'#f9fafb',borderRadius:'8px',padding:'7px 8px',border:`1px solid ${remaining>0?'#fc546620':'#16a34a30'}`,textAlign:'center'}}>
                                    <div style={{fontSize:'8.5px',color:'#aaa',marginBottom:'2px'}}>待收 Due</div>
                                    <div style={{fontSize:'12px',fontWeight:700,color:remaining>0?'#fc5466':'#16a34a'}}>¥{remaining.toLocaleString('en',{minimumFractionDigits:2})}</div>
                                    <div style={{fontSize:'8px',color:'#aaa'}}>{(100-paidPct).toFixed(1)}%</div>
                                </div>
                            </div>

                            {/* Progress bar */}
                            <div style={{marginBottom:'10px'}}>
                                <div style={{width:'100%',height:'6px',background:'#e5e7eb',borderRadius:'99px',overflow:'hidden',position:'relative'}}>
                                    <div style={{height:'100%',width:`${Math.min(paidPct,100)}%`,background:ps==='fully_paid'?'#16a34a':totalPaid>0?'#f59e0b':'#e5e7eb',borderRadius:'99px',transition:'width 0.4s ease'}} />
                                    <div style={{position:'absolute',top:0,left:'30%',width:'1.5px',height:'100%',background:'#ff8b3d',opacity:0.7}} />
                                </div>
                                <div style={{position:'relative',height:'14px',marginTop:'2px'}}>
                                    <span style={{position:'absolute',left:0,fontSize:'8px',color:'#aaa'}}>已收 {paidPct.toFixed(1)}%</span>
                                    <span style={{position:'absolute',left:'30%',transform:'translateX(-50%)',fontSize:'8px',color:'#ff8b3d',whiteSpace:'nowrap'}}>▲ 30%</span>
                                    <span style={{position:'absolute',right:0,fontSize:'8px',color:'#aaa'}}>100%</span>
                                </div>
                                {isUnderStd && (
                                    <div style={{marginTop:'3px',fontSize:'9px',color:'#d97706',fontWeight:600}}>
                                        ⚠ 距标准定金 30% 还差 <strong>¥{gapToStd.toLocaleString('en',{minimumFractionDigits:2})}</strong>
                                    </div>
                                )}
                                {stdDepositReached && ps !== 'fully_paid' && (
                                    <div style={{marginTop:'3px',fontSize:'9px',color:'#16a34a'}}>✓ 已达标准定金 30%，尾款待收 ¥{remaining.toLocaleString('en',{minimumFractionDigits:2})}</div>
                                )}
                            </div>

                            {/* Payment history */}
                            {paymentRecords.length > 0 && (
                                <div style={{marginBottom:'10px',border:'1px solid #ebebeb',borderRadius:'8px',overflow:'hidden'}}>
                                    <div style={{background:'#f5f5f5',padding:'4px 10px',fontSize:'9px',color:'#999',fontWeight:600,letterSpacing:'0.5px'}}>收款历史 PAYMENT HISTORY</div>
                                    {paymentRecords.map((rec, ri) => (
                                        <div key={ri} style={{display:'flex',alignItems:'center',padding:'5px 10px',borderTop:ri>0?'1px solid #f5f5f5':'none',background:'#fff'}}>
                                            <div style={{width:'6px',height:'6px',borderRadius:'50%',background:'#16a34a',flexShrink:0,marginRight:'8px'}} />
                                            <div style={{flex:1}}>
                                                <span style={{fontSize:'11px',fontWeight:700,color:'#233749'}}>¥{(rec.amount||0).toLocaleString('en',{minimumFractionDigits:2})}</span>
                                                {rec.note && <span style={{fontSize:'10px',color:'#999',marginLeft:'8px'}}>{rec.note}</span>}
                                            </div>
                                            <div style={{fontSize:'9px',color:'#bbb',flexShrink:0}}>{rec.date}</div>
                                            {onUpdateOrders && ps !== 'fully_paid' && (
                                                <button
                                                    onClick={() => {
                                                        const newRecs = paymentRecords.filter((_, i) => i !== ri);
                                                        const newTP = newRecs.reduce((s,r)=>s+(r.amount||0),0);
                                                        const newPS = newTP <= 0 ? 'unpaid' : newTP >= total ? 'fully_paid' : 'deposit_paid';
                                                        const newCS = {...(order.costSnapshot||{}), _paymentRecords: newRecs};
                                                        const updated = (allOrdersForCustomer||[]).map(o => o.id===order.id ? {...o, depositAmount:newTP, balanceAmount:Math.max(0,total-newTP), paymentStatus:newPS, costSnapshot:newCS} : o);
                                                        onUpdateOrders(updated);
                                                        if (showToast) showToast('收款记录已删除');
                                                    }}

                                                const newRecs = [...paymentRecords, newRec];
                                                const newTP = newRecs.reduce((s,r)=>s+(r.amount||0),0);
                                                const newPS = newTP >= total ? 'fully_paid' : 'deposit_paid';
                                                const newCS = {...(order.costSnapshot||{}), _paymentRecords: newRecs};
                                                const updated = (allOrdersForCustomer||[]).map(o => o.id===order.id ? {...o, depositAmount:newTP, balanceAmount:Math.max(0,total-newTP), paymentStatus:newPS, costSnapshot:newCS} : o);
                                                onUpdateOrders(updated);

                {/* Order items (collapsible) */}
                <div className="px-5 py-2.5">
                    <div className="bg-gray-50 rounded-lg overflow-hidden">

                {/* Factory Assignment */}

                {/* Action Bar */}

                    <div className="flex items-center gap-1.5 flex-wrap">
                        {(order.stageHistory || []).map((sh, si) => (

                                </svg>
                                修改订单 Edit
                            </button>

                        {/* Revert — blocked only when Delivered + fully paid */}
                        {currentIdx > 0 && !(order.stage === 'Delivered' && order.paymentStatus === 'fully_paid') && onRevertStage && (
                            <button
                                onClick={() => onRevertStage(order.id)}

                            >

                        {/* Advance */}
                        {nextStage && onAdvanceStage && (
                            <button
                                onClick={() => onAdvanceStage(order.id)}

                            >
                                <Icon name={ORDER_STAGE_META[nextStage]?.icon} size={13} className="inline mr-0.5" /> 推进到 {ORDER_STAGE_META[nextStage]?.label}
                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                        {order.stage === 'Delivered' && (
                            <span className="text-[11px] font-medium text-green-600 bg-green-50 px-3 py-1.5 rounded-lg ring-1 ring-green-200">

                            </span>

                        {/* Export Document Buttons — show for shipped/delivered orders or any order */}
                        {(order.stage === 'In_Transit' || order.stage === 'At_Warehouse' || order.stage === 'Delivered' || order.stage === 'Ex_Factory') && (
                            <>
                                <div className="w-px h-5 bg-gray-200 mx-1"></div>
                                {onGenerateInvoice && (
                                    <button
                                        onClick={() => onGenerateInvoice(order)}
                                        className="text-[11px] font-medium text-gray-600 bg-white border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-amber-50 hover:text-amber-700 hover:border-amber-200 transition-colors flex items-center gap-1"
                                    >

                                    </button>

                                {onGeneratePackingList && (
                                    <button
                                        onClick={() => onGeneratePackingList(order)}
                                        className="text-[11px] font-medium text-gray-600 bg-white border border-gray-200 rounded-lg px-3 py-1.5 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-200 transition-colors flex items-center gap-1"
                                    >
                                        <Icon name="package" size={13} className="inline mr-0.5" /> Packing List
                                    </button>
                                )}
                            </>
                        )}
                    </div>
                </div>
            </div>
        );
    };

    // Customer Detail View
    const CustomerDetail = ({ customer, purchasedItems, quoteHistory, orders, products, onBack, onUpdateItems, onAddQuote, onUpdateQuote, onUpdateQuoteStatus, onDeleteQuote, onUpdateOrders, showToast, onDeleteCustomer, onUpdateCustomer }) => {
        const [items, setItems] = useState(purchasedItems || []);
        const [addingRow, setAddingRow] = useState(false);
        const [newRow, setNewRow] = useState({ sku: '', product: '', spec: '', lastPrice: '', plateFee: 'unpaid', pcsPerCarton: '', cartonL: '', cartonW: '', cartonH: '' });
        const [activeTab, setActiveTab] = useState('items'); // 'items' or 'quotes'
        const [copiedId, setCopiedId] = useState(null);
        const [confirmDeleteItem, setConfirmDeleteItem] = useState(null);
        const [confirmDeleteQuote, setConfirmDeleteQuote] = useState(null);
        const [deliveredCollapsed, setDeliveredCollapsed] = useState(true);
        const [confirmDeleteCust, setConfirmDeleteCust] = useState(false);

        // ===== Edit Customer Info =====
        const [editMode, setEditMode] = useState(false);
        const [editForm, setEditForm] = useState({
            company: customer.company || '', companyZh: customer.companyZh || '',
            contact: customer.contact || '', contactZh: customer.contactZh || '',
            phone: customer.phone || '', address: customer.address || '',
            paymentTerms: customer.paymentTerms || 'cash',
            status: customer.status || 'active',
            socialType: customer.socialApp?.type || 'wechat',
            socialHandle: customer.socialApp?.handle || '',
            tags: customer.tags || [],
        });
        const handleEditSave = async () => {
            if (!editForm.company.trim() && !editForm.companyZh.trim()) { showToast('请输入公司名称 Company name required'); return; }
            const updated = {
                ...customer,
                company: editForm.company.trim() || editForm.companyZh.trim(),
                companyZh: editForm.companyZh.trim() || editForm.company.trim(),
                contact: editForm.contact.trim(), contactZh: editForm.contactZh.trim(),
                phone: editForm.phone.trim(), address: editForm.address.trim(),
                paymentTerms: editForm.paymentTerms, status: editForm.status,
                tags: editForm.tags,
                socialApp: editForm.socialHandle.trim() ? { type: editForm.socialType, handle: editForm.socialHandle.trim() } : null,
            };
            if (onUpdateCustomer) {
                await onUpdateCustomer(customer.id, updated);
                showToast(`${updated.company} 已更新 Updated!`);
            }
            setEditMode(false);
        };

        // ===== Select & Build Quote =====
        const [selectedIds, setSelectedIds] = useState(new Set());
        const [quoteBuilderOpen, setQuoteBuilderOpen] = useState(false);
        const [quoteQtys, setQuoteQtys] = useState({}); // { itemId: qty }
        const [quotePrices, setQuotePrices] = useState({}); // { itemId: unitPrice }
        const [quoteNote, setQuoteNote] = useState('');

        const toggleSelect = (id) => {
            setSelectedIds(prev => {
                const next = new Set(prev);
                if (next.has(id)) next.delete(id); else next.add(id);
                return next;
            });
        };
        const toggleSelectAll = () => {
            if (selectedIds.size === items.length) {
                setSelectedIds(new Set());
            } else {
                setSelectedIds(new Set(items.map(i => i.id)));
            }
        };
        const selectedItems = items.filter(i => selectedIds.has(i.id));

        const openQuoteBuilder = () => {
            const qtys = {};
            const prices = {};
            // Auto-fill from history: quote → order → purchased item → product catalog
            selectedItems.forEach(item => {
                let bestQty = '';
                let bestPrice = item.lastPrice || 0;
                const sku = item.sku;
                // Search latest quote for this product
                const sortedQ = [...(quoteHistory || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                for (const q of sortedQ) {
                    const found = (q.items || []).find(it => it.sku === sku);
                    if (found) { bestPrice = found.unitPrice; bestQty = found.qty; break; }
                }
                // If no quote, search latest order
                if (!bestQty) {
                    const sortedO = [...(orders || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                    for (const o of sortedO) {
                        const found = (o.items || []).find(it => it.sku === sku);
                        if (found) { bestPrice = found.unitPrice; bestQty = found.qty; break; }
                    }
                }
                qtys[item.id] = bestQty || '';
                prices[item.id] = bestPrice;
            });
            setQuoteQtys(qtys);
            setQuotePrices(prices);
            setQuoteNote('');
            setQuoteBuilderOpen(true);
        };

        // Shipping/tax setting for quote
        const [quoteShipping, setQuoteShipping] = useState('含运费'); // '含运费' or '不含运费'
        const [quoteTax, setQuoteTax] = useState('不含税'); // '含税' or '不含税'

        // ===== New Quote Slide-over Panel =====
        const [newQuoteOpen, setNewQuoteOpen] = useState(false);
        const [nqLines, setNqLines] = useState([{ productId: '', qty: '', unitPrice: '' }]);
        const [nqNote, setNqNote] = useState('');
        const [nqShipping, setNqShipping] = useState('含运费');
        const [nqTax, setNqTax] = useState('不含税');
        // ===== Edit Quote State =====
        const [editingQuoteId, setEditingQuoteId] = useState(null);

        const openNewQuote = () => {
            setEditingQuoteId(null);
            setNqLines([{ productId: '', qty: '', unitPrice: '' }]);
            setNqNote('');
            setNqShipping('含运费');
            setNqTax('不含税');
            setNewQuoteOpen(true);
        };

        const openEditQuote = (quote) => {
            setEditingQuoteId(quote.id);
            // Map quote items back to nqLines format
            const lines = quote.items.map(item => {
                // Find product by SKU or name
                const prod = products.find(p => p.sku === item.sku) || products.find(p => p.name === item.product);
                return { productId: prod?.id || '', qty: String(item.qty), unitPrice: String(item.unitPrice), _fallbackProduct: item.product, _fallbackSku: item.sku };
            });
            setNqLines(lines.length > 0 ? lines : [{ productId: '', qty: '', unitPrice: '' }]);
            setNqNote(quote.note || '');
            setNqShipping(quote.shipping || '含运费');
            setNqTax(quote.tax || '不含税');
            setNewQuoteOpen(true);
        };

        const addNqLine = () => setNqLines(prev => [...prev, { productId: '', qty: '', unitPrice: '' }]);
        const removeNqLine = (idx) => setNqLines(prev => prev.length > 1 ? prev.filter((_, i) => i !== idx) : prev);
        const updateNqLine = (idx, field, value) => setNqLines(prev => prev.map((l, i) => i === idx ? { ...l, [field]: value } : l));

        // === Smart lookup: find best historical price & qty for a product ===
        // Priority: 1) latest quote → 2) latest order → 3) purchased item → 4) product catalog
        const lookupHistory = (prod) => {
            const sku = prod.sku;
            let bestPrice = prod.price || prod.cost || '';
            let bestQty = '';
            let source = '';
            // 1) Search quote history (newest first) for this product
            const sortedQuotes = [...(quoteHistory || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            for (const q of sortedQuotes) {
                const found = (q.items || []).find(it => it.sku === sku);
                if (found) { bestPrice = found.unitPrice; bestQty = found.qty; source = 'quote'; break; }
            }
            // 2) If no quote found, search order history (newest first)
            if (!source) {
                const sortedOrders = [...(orders || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                for (const o of sortedOrders) {
                    const found = (o.items || []).find(it => it.sku === sku);
                    if (found) { bestPrice = found.unitPrice; bestQty = found.qty; source = 'order'; break; }
                }
            }
            // 3) If no order found, search purchased items for lastPrice
            if (!source) {
                const pi = items.find(it => it.sku === sku);
                if (pi && pi.lastPrice) { bestPrice = pi.lastPrice; source = 'purchased'; }
            }
            return { price: bestPrice, qty: bestQty, source };
        };

        // Add all products of a category at once (with history auto-fill)
        const addNqCategory = (category) => {
            const catProducts = products.filter(p => p.category === category);
            if (catProducts.length === 0) return;
            // Filter out products already in the lines
            const existingIds = new Set(nqLines.map(l => l.productId).filter(Boolean));
            const newProducts = catProducts.filter(p => !existingIds.has(p.id));
            if (newProducts.length === 0) { showToast('该类别产品已全部添加 All products in this category already added'); return; }
            const newLines = newProducts.map(p => {
                const hist = lookupHistory(p);
                return { productId: p.id, qty: hist.qty || '', unitPrice: hist.price || p.price || p.cost || '' };
            });
            // Remove empty placeholder lines, then add new lines
            setNqLines(prev => {
                const existing = prev.filter(l => l.productId);
                return existing.length > 0 ? [...existing, ...newLines] : newLines;
            });
            const catLabel = (CATEGORY_META[category] || {}).label || category;
            const histCount = newLines.filter(l => l.qty).length;
            const msg = histCount > 0
                ? `已添加 ${newProducts.length} 个${catLabel.split(' ')[0]}产品 (${histCount} 个已自动填入历史数据)`
                : `已添加 ${newProducts.length} 个${catLabel.split(' ')[0]}产品`;
            showToast(msg);
        };
        const [showCatPicker, setShowCatPicker] = useState(false);

        // Select product with auto-fill from history
        const handleNqProductSelect = (idx, productId) => {
            const prod = products.find(p => p.id === productId);
            if (prod) {
                const hist = lookupHistory(prod);
                setNqLines(prev => prev.map((l, i) => i === idx ? {
                    ...l,
                    productId: prod.id,
                    qty: hist.qty || l.qty || '',
                    unitPrice: hist.price || prod.price || prod.cost || '',
                } : l));
            } else {

        const saveNewQuote = () => {

                setEditingQuoteId(null);
                showToast('报价单已更新! Quote updated!');

                // ── Create mode: new quote ──
                const today = new Date().toISOString().slice(0, 10);
                const record = { date: today, items: quoteItems, note: nqNote.trim(), shipping: nqShipping, tax: nqTax, status: 'draft', costWarnings: [] };

                showToast('报价单已保存! Quote saved!');

        // ===== Deposit input editing (keyed by orderId) =====
        const [depositInputs, setDepositInputs] = useState({});

        // ===== Edit Order Slide-over =====

            setEditingOrder(order);

                const prod = products.find(p => p.sku === item.sku) || products.find(p => p.name === item.product);
                return { productId: prod?.id || '', qty: String(item.qty), unitPrice: String(item.unitPrice), _fallbackProduct: item.product, _fallbackSku: item.sku };
            });
            setEoLines(lines.length > 0 ? lines : [{ productId: '', qty: '', unitPrice: '' }]);

            setEoEstDate(order.estimatedCompletionDate || '');
            setEditOrderOpen(true);
        };

        const addEoLine = () => setEoLines(prev => [...prev, { productId: '', qty: '', unitPrice: '' }]);
        const removeEoLine = (idx) => setEoLines(prev => prev.length > 1 ? prev.filter((_, i) => i !== idx) : prev);
        const updateEoLine = (idx, field, value) => setEoLines(prev => prev.map((l, i) => i === idx ? { ...l, [field]: value } : l));

        const handleEoProductSelect = (idx, productId) => {
            const prod = products.find(p => p.id === productId);
            if (prod) {
                const hist = lookupHistory(prod);
                setEoLines(prev => prev.map((l, i) => i === idx ? {
                    ...l, productId: prod.id,
                    qty: l.qty || hist.qty || '',
                    unitPrice: l.unitPrice || hist.price || prod.price || prod.cost || '',
                } : l));
            } else {
                updateEoLine(idx, 'productId', productId);
            }
        };

        const saveEditOrder = () => {
            if (!editingOrder) return;
            const orderItems = eoLines.filter(l => (l.productId || l._fallbackProduct) && parseInt(l.qty) > 0).map(l => {
                const prod = products.find(p => p.id === l.productId);
                return {
                    sku: prod?.sku || l._fallbackSku || '',
                    product: prod?.name || l._fallbackProduct || l.productId,
                    spec: '', qty: parseInt(l.qty) || 0, unitPrice: parseFloat(l.unitPrice) || 0,
                };
            });
            if (orderItems.length === 0) { showToast('请至少添加一项产品 Please add at least one product'); return; }
            const totalAmount = orderItems.reduce((s, i) => s + i.qty * i.unitPrice, 0);
            const updated = (orders || []).map(o => {
                if (o.id !== editingOrder.id) return o;
                return { ...o, items: orderItems, totalAmount, note: eoNote.trim(), estimatedCompletionDate: eoEstDate || o.estimatedCompletionDate };

            onUpdateOrders(updated);

        // Build quote items from selections (shared by PDF and copy)
        const getQuoteItems = () => {
            return selectedItems.map(item => ({
                sku: item.sku || '',

                qty: parseInt(quoteQtys[item.id]) || 0,

        // Generate WeChat-friendly text for a quote (new premium format)
        const generateQuoteText = (quote) => {
            const companyName = customer.companyZh || customer.company;
            const sep = '────────────────';
            const lines = [];
            lines.push(`${quote.date} 报价单 - ${companyName}`);
            lines.push(sep);

            let totalQty = 0;
            let totalAmount = 0;
            quote.items.forEach((item, idx) => {
                const amount = item.qty * item.unitPrice;
                totalQty += item.qty;
                totalAmount += amount;
                const skuTag = item.sku ? ` [${item.sku}]` : '';
                lines.push(`${idx + 1}. ${item.product}${skuTag}`);
                if (item.spec) lines.push(`   规格: ${item.spec}`);
                lines.push(`   数量: ${item.qty.toLocaleString()} | 单价: ¥${item.unitPrice.toFixed(2)} | 小计: ¥${amount.toFixed(2)}`);
                lines.push(sep);
            });

            lines.push(`总数量: ${totalQty.toLocaleString()}`);
            lines.push(`总计: ¥${totalAmount.toFixed(2)}`);

            const shippingNote = quote.shipping || quoteShipping;
            const taxNote = quote.tax || quoteTax;
            lines.push(`(${shippingNote} / ${taxNote})`);

            if (quote.note) lines.push(`备注: ${quote.note}`);
            lines.push('');
            lines.push('— Pocket Packet');
            return lines.join('\n');

                    </thead>

                <!-- Totals -->
                <div style="display:flex;justify-content:flex-end;margin-bottom:24px;">

                        <tr><td style="padding:5px 18px 5px 0;color:#999;text-align:right;">Tax (${taxRate > 0 ? (taxRate * 100).toFixed(0) + '%' : '0%'}):</td><td style="font-weight:600;text-align:right;">CN¥${taxAmount.toLocaleString('en', { minimumFractionDigits: 2 })}</td></tr>
                        <tr style="border-top:2px solid #eee;"><td style="padding:8px 18px 5px 0;color:#333;font-weight:700;text-align:right;font-size:13px;">Total:</td><td style="font-weight:800;text-align:right;font-size:15px;">CN¥${total.toLocaleString('en', { minimumFractionDigits: 2 })}</td></tr>
                    </table>
                </div>

                <!-- Footer — clean text info: logistics in blue, terms in gray -->
                <div style="border-top:1px solid #e8e8e8;padding-top:12px;display:flex;justify-content:space-between;align-items:flex-start;">

                            ${pdfTotalCartons > 0 ? `<span style="font-size:11px;color:#0369a1;font-weight:600;">总箱数（预计）：${pdfTotalCartons} 箱</span>` : ''}
                            ${pdfTotalCBM > 0 ? `<span style="font-size:11px;color:#0369a1;font-weight:600;">总方数（预计）：${pdfTotalCBM.toFixed(3)} m³</span>` : ''}

                    <div style="text-align:right;flex-shrink:0;margin-left:16px;">

            const added = {
                ...newRow,

                lastPrice: parseFloat(newRow.lastPrice) || 0,

        return (

    // ========== Materials Page Component (extracted for proper React Hooks) ==========
    const MaterialsPage = ({ materials, setMaterials, products, setProducts, showToast, executePriceRipple, db }) => {
        const [matModal, setMatModal] = useState(false);
        const [matEditing, setMatEditing] = useState(null);
        const [matForm, setMatForm] = useState({ name: '', nameEn: '', spec: '', unit: 'kg', price: '', supplier: '' });
        const [matCascadeReport, setMatCascadeReport] = useState(null);
        const [expandedTypes, setExpandedTypes] = useState(() => new Set(MATERIAL_TAGS));
        const [expandedLinkedRow, setExpandedLinkedRow] = useState(null);
        const [seeding, setSeeding] = useState(false);

        const openMatAdd = () => { setMatEditing(null); setMatForm({ name: '', nameEn: '', spec: '', unit: 'kg', price: '', supplier: '' }); setMatModal(true); };
        const openMatEdit = (m) => { setMatEditing(m); setMatForm({ name: m.name || '', nameEn: m.nameEn || '', spec: m.spec || '', unit: m.unit || 'kg', price: String(m.price || ''), supplier: m.supplier || '' }); setMatModal(true); };
        const toggleType = (type) => setExpandedTypes(prev => { const n = new Set(prev); n.has(type) ? n.delete(type) : n.add(type); return n; });

        // Computed: which material types products use
        const usedMaterialTypes = useMemo(() => {
            const types = new Set();
            products.forEach(p => { const t = classifyProductMaterialType(p.material); if (t !== 'Other') types.add(t); });
            return types;
        }, [products]);

        // Computed: group materials by type
        const groupedMaterials = useMemo(() => {
            const groups = {};
            MATERIAL_TAGS.forEach(tag => { groups[tag] = []; });
            groups['Other'] = [];
            materials.forEach(m => {
                const type = classifyMaterialType(m.name, m.nameEn);
                (groups[type] || groups['Other']).push(m);
            });
            return groups;
        }, [materials]);

        // Computed: total linked product count
        const totalLinkedProductCount = useMemo(() => {
            const linked = new Set();
            materials.forEach(m => { getLinkedProducts(m, products).forEach(p => linked.add(p.id)); });
            return linked.size;
        }, [materials, products]);

        // Auto-seed: generate base materials from product types
        const handleAutoSeed = async () => {
            setSeeding(true);
            const today = new Date().toISOString().slice(0, 10);
            const existingNames = new Set(materials.map(m => m.name.toLowerCase()));
            const maxNum = materials.reduce((max, m) => { const n = parseInt(m.id.replace('MAT-', ''), 10); return n > max ? n : max; }, 0);
            let counter = maxNum;
            const newMats = [];
            for (const type of usedMaterialTypes) {
                const seeds = SEED_MATERIALS[type] || [];
                for (const seed of seeds) {
                    if (existingNames.has(seed.name.toLowerCase())) continue;
                    counter++;
                    const newMat = { id: 'MAT-' + String(counter).padStart(3, '0'), ...seed, trend: 'stable', lastPrice: 0, lastUpdate: today };
                    try {
                        await db.materials.insert(newMat);
                        newMats.push(newMat);
                        existingNames.add(seed.name.toLowerCase());
                    } catch (e) { console.warn('[PPOS] Seed material error:', e); }
                }
            }
            setMaterials(prev => [...prev, ...newMats]);
            showToast(`已自动生成 ${newMats.length} 种物料 Auto-seeded ${newMats.length} materials`, 8000);
            setSeeding(false);
        };

        const handleMatSave = async () => {
            if (!matForm.name.trim()) { showToast('请输入物料名称 Material name required'); return; }
            const newPrice = parseFloat(matForm.price) || 0;
            const today = new Date().toISOString().slice(0, 10);
            if (matEditing) {
                const oldPrice = matEditing.price || 0;
                const trend = newPrice > oldPrice ? 'up' : newPrice < oldPrice ? 'down' : matEditing.trend || 'stable';
                const updated = { ...matEditing, name: matForm.name.trim(), nameEn: matForm.nameEn.trim(), spec: matForm.spec.trim(), unit: matForm.unit, price: newPrice, lastPrice: oldPrice, supplier: matForm.supplier.trim(), trend, lastUpdate: today };
                try {
                    await db.materials.update(matEditing.id, updated);
                    setMaterials(prev => prev.map(m => m.id === matEditing.id ? updated : m));
                    showToast(`${updated.name} 已更新 Updated!`);
                    if (newPrice !== oldPrice && newPrice > 0 && oldPrice > 0) {
                        executeMaterialCascade(updated, oldPrice, newPrice);
                    }
                } catch (e) { showToast('更新失败: ' + e.message); }
            } else {
                const maxNum = materials.reduce((max, m) => { const n = parseInt(m.id.replace('MAT-', ''), 10); return n > max ? n : max; }, 0);
                const newMat = { id: 'MAT-' + String(maxNum + 1).padStart(3, '0'), name: matForm.name.trim(), nameEn: matForm.nameEn.trim(), spec: matForm.spec.trim(), unit: matForm.unit, price: newPrice, lastPrice: 0, supplier: matForm.supplier.trim(), trend: 'stable', lastUpdate: today };
                try {
                    await db.materials.insert(newMat);
                    setMaterials(prev => [...prev, newMat]);
                    showToast(`${newMat.name} 已添加 Added!`);
                } catch (e) { showToast('添加失败: ' + e.message); }
            }
            setMatModal(false);
        };

        const handleMatDelete = async (mat) => {
            if (!confirm(`确定删除 "${mat.name}" 吗？Delete "${mat.name}"?`)) return;
            try {
                await db.materials.softDelete(mat.id);
                setMaterials(prev => prev.filter(m => m.id !== mat.id));
                showToast(`${mat.name} 已删除 Deleted`);
            } catch (e) { showToast('删除失败: ' + e.message); }
        };

        const executeMaterialCascade = (material, oldMatPrice, newMatPrice) => {
            const affectedProducts = getLinkedProducts(material, products);
            if (affectedProducts.length === 0) {
                setMatCascadeReport({ material: material.name, oldPrice: oldMatPrice, newPrice: newMatPrice, affectedProducts: [], totalRippleReports: [] });
                return;
            }
            const priceRatio = newMatPrice / oldMatPrice;
            const cascadeReport = { material: material.name, oldPrice: oldMatPrice, newPrice: newMatPrice, affectedProducts: [], totalRippleReports: [] };
            const affectedIds = new Set(affectedProducts.map(p => p.id));
            const updatedProducts = products.map(p => {
                if (!affectedIds.has(p.id) || !p.cost || p.cost <= 0) return p;
                const oldCost = p.cost;
                const newCost = +(oldCost * priceRatio).toFixed(2);
                cascadeReport.affectedProducts.push({ sku: p.sku, name: p.name, oldCost, newCost, delta: +(newCost - oldCost).toFixed(2) });
                const newHistory = [...(p.costHistory || []), { date: new Date().toISOString().slice(0, 10), cost: newCost, note: `[Auto] 物料 ${material.name} 涨价 ¥${oldMatPrice}→¥${newMatPrice}` }];
                return { ...p, cost: newCost, costHistory: newHistory };
            });
            setProducts(updatedProducts);
            cascadeReport.affectedProducts.forEach(ap => {
                const prod = updatedProducts.find(p => p.sku === ap.sku);
                if (prod) db.products.update(prod.id, prod).catch(e => console.warn('[PPOS] Cascade product update error:', e));
            });
            cascadeReport.affectedProducts.forEach(ap => {
                const report = executePriceRipple(ap.sku, ap.oldCost, ap.newCost, ap.name);
                if (report) cascadeReport.totalRippleReports.push(report);
            });
            setMatCascadeReport(cascadeReport);
            const parts = [`${cascadeReport.affectedProducts.length} 个产品成本已调整`];
            const totalOrders = cascadeReport.totalRippleReports.reduce((s, r) => s + r.ordersUpdated.length, 0);
            const totalQuotes = cascadeReport.totalRippleReports.reduce((s, r) => s + r.draftQuotesUpdated.length + r.sentQuotesFlagged.length, 0);
            if (totalOrders > 0) parts.push(`${totalOrders} 订单已更新`);
            if (totalQuotes > 0) parts.push(`${totalQuotes} 报价已调整/标记`);
            showToast(`全链路级联完成! ${parts.join(', ')}`);
        };

        // Render a material table row + expandable linked-products sub-row
        const renderMatRow = (m) => {
            const diff = m.price - (m.lastPrice || 0);
            const diffPct = m.lastPrice > 0 ? ((diff / m.lastPrice) * 100).toFixed(1) : '0.0';
            const linkedProducts = getLinkedProducts(m, products);
            const isExpanded = expandedLinkedRow === m.id;
            return (
                <React.Fragment key={m.id}>

                    {isExpanded && linkedProducts.length > 0 && (

        // Table header for material groups

                    const hasMatchingItem = order.items.some(item => item.sku === changedSku);
                    if (!hasMatchingItem) return order;

                    // Recalculate: update item unitPrice (cost-based) and recalculate totals
                    const updatedItems = order.items.map(item => {
                        if (item.sku !== changedSku) return item;
                        // For orders, unitPrice IS the sell price to customer.
                        // We adjust by the same delta so margin stays similar.
                        const delta = newCost - oldCost;
                        const newUnitPrice = Math.max(0, +(item.unitPrice + delta).toFixed(4));
                        return { ...item, unitPrice: newUnitPrice };

                        orderId: order.id,
                        customerId,
                        customerName: customer ? (customer.companyZh || customer.company) : customerId,
                        oldTotal: order.totalAmount,
                        newTotal: +newTotal.toFixed(2),
                    });
                    changed = true;
                    return {
                        ...order,
                        items: updatedItems,
                        totalAmount: +newTotal.toFixed(2),
                        depositAmount: +(newTotal * 0.3).toFixed(2),
                        balanceAmount: +(newTotal * 0.7).toFixed(2),
                        note: order.note + `\n[Auto] 成本变动: ¥${oldCost}→¥${newCost}, 总价已更新`,
                    };
                });
                if (changed) updatedOrders[customerId] = newOrders;
            });
            // Apply order updates
            if (Object.keys(updatedOrders).length > 0) {
                setAllOrders(prev => {
                    const next = { ...prev };
                    Object.entries(updatedOrders).forEach(([cid, orders]) => { next[cid] = orders; });

                    const quoteStatus = quote.status || 'accepted';

                    if (quoteStatus === 'draft') {

                        const updatedItems = quote.items.map(item => {
                            if (item.sku !== changedSku) return item;
                            const delta = newCost - oldCost;
                            const newUnitPrice = Math.max(0, +(item.unitPrice + delta).toFixed(4));
                            return { ...item, unitPrice: newUnitPrice };
                        });
                        const oldTotal = quote.items.reduce((s, i) => s + i.qty * i.unitPrice, 0);

                    } else if (quoteStatus === 'sent') {

                            if (item.sku !== changedSku) return;

                            {/* Table toolbar */}
                            <div className="px-3 md:px-5 py-3 border-b border-gray-100 flex items-center justify-between gap-2 md:gap-4 table-toolbar">
                                <div className="flex items-center gap-2 md:gap-3 min-w-0">
                                    <h2 className="text-xs md:text-sm font-semibold text-[#233749] whitespace-nowrap">客户列表<span className="hidden md:inline"> Customer List</span></h2>
                                    <span className="text-[10px] md:text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full whitespace-nowrap">{filtered.length} records</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    {/* Search */}
                                    <div className="relative">
                                        <svg className="w-4 h-4 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                        </svg>
                                        <input
                                            type="text"
                                            value={search}
                                            onChange={e => setSearch(e.target.value)}
                                            placeholder="搜索 Search..."
                                            className="pl-8 pr-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#ff8b3d] focus:border-[#ff8b3d] w-32 md:w-48"
                                        />
                                    </div>
                                    {/* Status filter */}
                                    <select
                                        value={statusFilter}
                                        onChange={e => setStatusFilter(e.target.value)}
                                        className="text-xs border border-gray-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#ff8b3d] focus:border-[#ff8b3d] text-gray-600 bg-white"
                                    >
                                        <option value="all">全部 All</option>
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                        <option value="tag:VIP">VIP</option>
                                        <option value="tag:Risk">Risk</option>
                                        <option value="tag:Potential">Potential</option>
                                        <option value="churn">Churn (&gt;45d)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Table */}
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead>
                                        <tr className="bg-gray-50 border-b border-gray-100">
                                            {[
                                                { field: 'id', label: 'ID', align: 'left', hideOnMobile: true },
                                                { field: 'company', label: '公司名 Company', align: 'left' },
                                                { field: 'contact', label: '联系人 Contact', align: 'left' },
                                                { field: 'paymentTerms', label: '付款 Payment', align: 'center' },
                                                { field: 'lastOrder', label: '最后活跃 Last Active', align: 'center', hideOnMobile: true },
                                                { field: 'totalRevenue', label: '总产值 Revenue', align: 'right', hideOnMobile: true },
                                                { field: 'status', label: '状态 Status', align: 'center', hideOnMobile: true },
                                            ].map(col => (
                                                <th
                                                    key={col.field}
                                                    onClick={() => handleSort(col.field)}
                                                    className={`py-2.5 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider cursor-pointer select-none hover:text-[#233749] text-${col.align} ${col.hideOnMobile ? 'mobile-hide' : ''}`}
                                                >
                                                    {col.label}<SortIcon field={col.field} />
                                                </th>
                                            ))}
                                            <th className="py-2.5 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-center mobile-hide">联系 Quick</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filtered.length === 0 ? (
                                            <tr>
                                                <td colSpan="8" className="py-12 text-center text-gray-400 text-sm">
                                                    暂无匹配数据 No matching records
                                                </td>
                                            </tr>
                                        ) : (
                                            filtered.slice((custPage - 1) * CUST_PAGE_SIZE, custPage * CUST_PAGE_SIZE).map(c => {
                                                const inactiveDays = daysSince(c.lastActiveDate || c.lastOrder);
                                                const isChurn = inactiveDays > 45;
                                                return (
                                                <tr
                                                    key={c.id}
                                                    className={`table-row border-b border-gray-50 cursor-pointer ${isChurn ? 'bg-[#fc5466]/5' : ''}`}
                                                    onClick={() => setSelectedCustomerId(c.id)}
                                                >
                                                    <td className="py-3 px-4 text-xs font-mono text-gray-400 mobile-hide">{c.id}</td>
                                                    <td className="py-3 px-4">
                                                        <div className="flex items-center gap-2">
                                                            <div className="text-sm font-medium text-[#233749]">{c.company}</div>
                                                            {(c.tags || []).map(tag => <ClientTag key={tag} tag={tag} />)}
                                                        </div>
                                                        <div className="text-xs text-gray-400">{c.companyZh}</div>
                                                    </td>
                                                    <td className="py-3 px-4">
                                                        <div className="text-sm text-[#233749]/90">{c.contact}</div>
                                                        <div className="text-xs text-gray-400">{c.contactZh}</div>
                                                    </td>
                                                    <td className="py-3 px-4 text-center">
                                                        {(() => {
                                                            const pt = c.paymentTerms || 'cash';
                                                            const map = { cash: { text: '现结', cls: 'bg-blue-50 text-blue-600 ring-blue-200' }, net30: { text: '月结30', cls: 'bg-amber-50 text-amber-600 ring-amber-200' }, net60: { text: '月结60', cls: 'bg-[#fc5466]/5 text-[#fc5466] ring-[#fc5466]/30' } };
                                                            const info = map[pt] || map.cash;
                                                            return <span className={`text-[10px] font-medium px-2 py-0.5 rounded-full ring-1 ${info.cls}`}>{info.text}</span>;
                                                        })()}
                                                    </td>
                                                    <td className="py-3 px-4 text-center mobile-hide">
                                                        <div className="text-xs text-gray-600">{c.lastActiveDate || c.lastOrder}</div>
                                                        {isChurn && (
                                                            <div className="flex items-center justify-center gap-1 mt-0.5">
                                                                <span className="text-[10px] text-[#fc5466] font-medium"><Icon name="alert-triangle" size={10} className="inline mr-0.5" /> {inactiveDays}天未活跃</span>
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="py-3 px-4 text-right text-sm font-bold text-[#233749] mobile-hide">
                                                        ¥{c.totalRevenue.toLocaleString('en', { minimumFractionDigits: 2 })}
                                                    </td>
                                                    <td className="py-3 px-4 text-center mobile-hide">
                                                        <StatusBadge status={c.status} />
                                                    </td>
                                                    <td className="py-3 px-3 text-center mobile-hide">
                                                        <SocialButton socialApp={c.socialApp} showToast={showToast} />
                                                    </td>
                                                </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            {/* Table footer with Pagination */}
                            <div className="px-5 py-2.5 border-t border-gray-100 bg-[#fcf6fa]/50 flex items-center justify-between">
                                <span className="text-xs text-gray-400">
                                    共 {filtered.length} 条记录 · 第 {custPage}/{Math.ceil(filtered.length / CUST_PAGE_SIZE) || 1} 页
                                </span>
                                <Pagination total={filtered.length} pageSize={CUST_PAGE_SIZE} currentPage={custPage} onPageChange={(p) => setCustPage(p)} />
                            </div>
                        </div>
                        </>
                        )}
                    </main>
                </div>
            </div>
        );
    };

    // ========== Auth Wrapper (Top-Level App) ==========
    const PPOS_SESSION_KEY = 'ppos_auth_user';

    const App = () => {
        const [authUser, setAuthUser] = useState(null);
        const [authLoading, setAuthLoading] = useState(true);

        // Restore session from localStorage on mount
        useEffect(() => {
            try {
                const saved = localStorage.getItem(PPOS_SESSION_KEY);
                if (saved) {
                    const user = JSON.parse(saved);
                    if (user && user.id && user.username) {
                        setAuthUser(user);
                    }
                }
            } catch (err) {
                console.warn('[PPOS] Session restore error:', err);
                localStorage.removeItem(PPOS_SESSION_KEY);
            }
            setAuthLoading(false);
        }, []);

        const handleLogin = (user) => {
            setAuthUser(user);
            localStorage.setItem(PPOS_SESSION_KEY, JSON.stringify(user));
        };

        const handleLogout = async () => {
            setAuthUser(null);
            localStorage.removeItem(PPOS_SESSION_KEY);
        };

        // Show loading while checking session
        if (authLoading) {
            return (
                <div className="min-h-screen bg-[#233749] flex items-center justify-center">
                    <div className="text-center">
                        <div className="w-10 h-10 border-3 border-white/30 border-t-white rounded-full animate-spin mx-auto mb-3"></div>
                        <p className="text-white/70 text-sm">Loading...</p>
                    </div>
                </div>
            );
        }

        // Auth gate: not logged in → Login page
        if (!authUser) {
            return <LoginPage onLogin={handleLogin} />;
        }

        // Protected route: factory role → Vendor Portal
        if (authUser.role === 'factory') {
            return <VendorPortal authUser={authUser} onLogout={handleLogout} />;
        }

        // Admin / Sales / Ops / Finance → PPOS
        return <CRMApp authUser={authUser} onLogout={handleLogout} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
