    const loadFromStorage = (key, fallback) => {
        try {
            const raw = localStorage.getItem(key);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(fallback) && Array.isArray(parsed)) return parsed;
                if (!Array.isArray(fallback) && typeof parsed === 'object' && parsed !== null) return parsed;
            }
        } catch (e) {
            console.warn(`[PPOS] Failed to load ${key} from localStorage:`, e);
        }
        return fallback;
    };

    const saveToStorage = (key, data) => {
        try {
            localStorage.setItem(key, JSON.stringify(data));
        } catch (e) {
            console.warn(`[PPOS] Failed to save ${key} to localStorage:`, e);
        }

            sortOrder: 'sort_order', passwordHash: 'password_hash',
            nameEn: 'name_en', leadTime: 'lead_time', startDate: 'start_date',
            lastUpdate: 'last_update', lastPrice: 'last_price',
            productSku: 'product_sku', productName: 'product_name', oldCost: 'old_cost',
            newCost: 'new_cost', affectedOrders: 'affected_orders', affectedQuotes: 'affected_quotes',

            legalEntityName: 'legal_entity_name', vatNumber: 'vat_number', vatRegistered: 'vat_registered',
            pvaEnabled: 'pva_enabled', displayName: 'display_name',
        };
        if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return obj;
        const result = {};
        for (const [k, v] of Object.entries(obj)) {
            result[map[k] || k] = v;
        }
        return result;

        const encoder = new TextEncoder();

        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

                username: username.toLowerCase(),
                display_name: displayName || username,
                email: username.toLowerCase() + '@ppos.local',
                role,
                password_hash: pwHash,
            };
            if (linkedFactoryId) insertObj.linked_factory_id = linkedFactoryId;
            const { data, error } = await supabase.from('profiles').insert(insertObj).select().single();

                    return { error: { message: '用户名已存在 Username already exists' } };
                }
                return { error: { message: error.message } };
            }
            return { data: { user: data }, error: null };

                            /* ===== Normal Login Form ===== */
                            <form onSubmit={handleSubmit} className="px-8 py-6 space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1.5">账号 Account</label>
                                    <div className="relative">
                                        <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                        </svg>
                                        <input
                                            type="text" value={account} onChange={e => { setAccount(e.target.value); setError(''); }}
                                            className="w-full pl-10 pr-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#ff8b3d]/40 focus:border-[#ff8b3d] bg-gray-50 transition-all"
                                            placeholder="用户名 Username" autoComplete="username" autoFocus
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-gray-600 mb-1.5">密码 Password</label>
                                    <div className="relative">
                                        <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                        </svg>
                                        <input
                                            type={showPw ? 'text' : 'password'} value={password} onChange={e => { setPassword(e.target.value); setError(''); }}
                                            className="w-full pl-10 pr-10 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#ff8b3d]/40 focus:border-[#ff8b3d] bg-gray-50 transition-all"
                                            placeholder="Enter password" autoComplete="current-password"
                                        />
                                        <button type="button" onClick={() => setShowPw(v => !v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors" tabIndex={-1}>
                                            {showPw
                                                ? <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
                                                : <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                            }
                                        </button>
                                    </div>
                                </div>

                                {/* Error */}
                                {error && (
                                    <div className="flex items-center gap-2 bg-[#fc5466]/5 border border-[#fc5466]/20 rounded-lg px-3 py-2 fade-in">
                                        <svg className="w-4 h-4 text-[#fc5466] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.27 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                                        </svg>
                                        <span className="text-xs text-[#fc5466] font-medium">{error}</span>
                                    </div>
                                )}

                                {/* Login button */}
                                <button
                                    type="submit" disabled={loading}
                                    className={`w-full py-2.5 rounded-lg text-sm font-bold text-white transition-all flex items-center justify-center gap-2 ${
                                        loading ? 'bg-[#ff8b3d]/70 cursor-not-allowed' : 'bg-[#ff8b3d] hover:bg-[#e67a30] shadow-sm hover:shadow-md'
                                    }`}
                                >
                                    {loading ? (
                                        <><svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg> 登录中...</>
                                    ) : (
                                        <>
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                                            </svg>
                                            登录 Login
                                        </>
                                    )}
                                </button>
                            </form>
                        )}

                        {/* Footer */}
                        <div className="px-8 pb-5 text-center">
                            <p className="text-[10px] text-gray-300">Authorized personnel only.</p>
                        </div>
                    </div>

                    {/* Info hint */}
                    <div className="mt-4 bg-white/5 backdrop-blur rounded-xl border border-white/10 px-4 py-3">
                        <div className="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-1.5">PPOS v2.1</div>
                        <div className="text-[10px] text-gray-500">{isFirstTime ? '首次使用请创建管理员账号 First-time setup: create admin account' : '使用用户名和密码登录 Sign in with username & password'}</div>
                    </div>
                </div>
            </div>
        );
    };

    // ========== Vendor Portal (Factory Role Page) ==========
    const VendorPortal = ({ authUser, onLogout }) => {
        const [activeTab, setActiveTab] = useState('orders');
        const [toast, setToast] = useState('');
        const showToast = (msg, duration) => { setToast(msg); setTimeout(() => setToast(''), duration || 5000); };

        // Load shared data from Supabase
        const [allOrdersList, setAllOrdersList] = useState([]);
        const [customers, setCustomers] = useState([]);
        const [products, setProducts] = useState([]);
        const [factories, setFactories] = useState([]);
        const [vpLoading, setVpLoading] = useState(true);
        const [selectedOrder, setSelectedOrder] = useState(null);
        const [noteText, setNoteText] = useState('');
        const [updatingStage, setUpdatingStage] = useState(false);

        const loadData = async () => {
            try {
                const [o, c, p, f] = await Promise.all([db.orders.listAll(), db.customers.list(), db.products.list(), db.factories.list()]);
                setAllOrdersList(o);
                setCustomers(c);
                setProducts(p);
                setFactories(f);
            } catch (err) { console.error('[VendorPortal] load error:', err); }
            setVpLoading(false);
        };

        useEffect(() => { loadData(); }, []);

        // Find factory linked to this user
        const myFactory = useMemo(() => {
            if (!authUser.linkedFactoryId) return null;
            return factories.find(f => f.id === authUser.linkedFactoryId) || null;
        }, [authUser.linkedFactoryId, factories]);

        // Flatten all orders with customer names, filter by factory if linked
        const flatOrders = useMemo(() => {
            return allOrdersList.map(o => {
                const cust = customers.find(c => c.id === o.customerId);
                return { ...o, customerName: cust?.company || cust?.companyZh || o.customerId };
            }).filter(o => {
                // If user is linked to a factory, only show orders assigned to that factory
                if (authUser.linkedFactoryId) return o.factoryId === authUser.linkedFactoryId;
                return true; // If no factory linked, show all (for testing)
            }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        }, [allOrdersList, customers, authUser.linkedFactoryId]);

        const pendingOrders = flatOrders.filter(o => ['Order_Placed', 'Deposit_Paid'].includes(o.stage));
        const productionOrders = flatOrders.filter(o => o.stage === 'Production');
        const completedOrders = flatOrders.filter(o => ['Ex_Factory', 'In_Transit', 'At_Warehouse', 'Delivered'].includes(o.stage));
        const activeOrders = flatOrders.filter(o => o.stage !== 'Delivered');

        // Factory can update stages: Production → Ex_Factory
        const handleFactoryAdvance = async (order) => {
            const FACTORY_ALLOWED = ['Production', 'Ex_Factory'];
            if (!FACTORY_ALLOWED.includes(order.stage)) {
                showToast('⚠️ 当前状态不允许工厂推进 Cannot advance at this stage');
                return;
            }
            setUpdatingStage(true);
            const currentIdx = ORDER_STAGE_KEYS.indexOf(order.stage);
            const nextStage = ORDER_STAGE_KEYS[currentIdx + 1];
            if (!nextStage) { setUpdatingStage(false); return; }
            const today = new Date().toISOString().slice(0, 10);
            const newHistory = [...(order.stageHistory || []), { stage: nextStage, date: today, by: authUser.displayName + ' (工厂)' }];
            try {
                await db.orders.update(order.id, { stage: nextStage, stageHistory: newHistory });
                showToast(`✅ ${order.id} → ${ORDER_STAGE_META[nextStage]?.label || nextStage}`);
                await loadData();
                setSelectedOrder(prev => prev ? { ...prev, stage: nextStage, stageHistory: newHistory } : null);
            } catch (err) {
                showToast('更新失败 Update failed: ' + err.message);
            }
            setUpdatingStage(false);
        };

        // Update production note
        const handleSaveNote = async (order) => {
            try {
                await db.orders.update(order.id, { productionNote: noteText });
                showToast('备注已保存 Note saved!');
                await loadData();
                setSelectedOrder(prev => prev ? { ...prev, productionNote: noteText } : null);
            } catch (err) {
                showToast('保存失败 Save failed: ' + err.message);
            }
        };

        // Update production progress (0-100)
        const handleUpdateProgress = async (order, progress) => {
            try {
                await db.orders.update(order.id, { productionProgress: progress });
                await loadData();
                setSelectedOrder(prev => prev ? { ...prev, productionProgress: progress } : null);
            } catch (err) {
                showToast('更新失败 Update failed');
            }
        };

        const VENDOR_TABS = [
            { key: 'orders', label: '全部订单 All Orders', icon: 'clipboard', count: flatOrders.length },
            { key: 'production', label: '生产中 Production', icon: 'factory', count: productionOrders.length },
            { key: 'completed', label: '已完成 Completed', icon: 'check-circle', count: completedOrders.length },
        ];

        const STAGE_COLORS = {
            'Order_Placed': 'bg-gray-100 text-gray-600',
            'Deposit_Paid': 'bg-blue-100 text-blue-700',
            'Production': 'bg-indigo-100 text-indigo-700',
            'Ex_Factory': 'bg-purple-100 text-purple-700',
            'In_Transit': 'bg-amber-100 text-amber-700',
            'At_Warehouse': 'bg-cyan-100 text-cyan-700',
            'Delivered': 'bg-green-100 text-green-700',
        };

        // Order detail slide-over panel
        const renderOrderDetail = () => {
            if (!selectedOrder) return null;
            const order = flatOrders.find(o => o.id === selectedOrder.id) || selectedOrder;
            const totalAmt = order.totalAmountIncTax || order.totalAmount || (order.items || []).reduce((s, i) => s + (i.qty || 0) * (i.unitPrice || 0), 0);
            const stageMeta = ORDER_STAGE_META[order.stage];
            const progress = order.productionProgress || 0;
            const canAdvance = ['Production', 'Ex_Factory'].includes(order.stage);
            const daysInProd = (() => {
                const prodEntry = [...(order.stageHistory || [])].reverse().find(h => h.stage === 'Production');
                return prodEntry ? Math.floor((Date.now() - new Date(prodEntry.date).getTime()) / 86400000) : 0;
            })();

            return (
                <>
                    <div className="fixed inset-0 bg-black/30 z-[55]" onClick={() => setSelectedOrder(null)} />
                    <div className="fixed top-0 right-0 bottom-0 z-[56] w-full max-w-lg bg-white shadow-2xl flex flex-col overflow-hidden fade-in">
                        {/* Header */}
                        <div className="px-4 md:px-6 py-4 border-b border-gray-100 bg-purple-50/50 flex items-center justify-between shrink-0">
                            <div>
                                <div className="text-base font-bold text-[#233749] font-mono">{order.id}</div>
                                <div className="text-xs text-gray-500 mt-0.5">{order.customerName} · {order.date}</div>
                            </div>
                            <div className="flex items-center gap-2">
                                <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold ${STAGE_COLORS[order.stage] || 'bg-gray-100'}`}>
                                    {stageMeta?.icon && <Icon name={stageMeta.icon} size={12} />} {stageMeta?.label}
                                </span>
                                <button onClick={() => setSelectedOrder(null)} className="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </div>
                        </div>

                        {/* Scrollable body */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-5">
                            {/* Stage Progress (mini stepper) */}
                            <div className="bg-white rounded-xl border border-gray-100 p-4">
                                <div className="text-xs font-semibold text-[#233749] mb-3 flex items-center gap-2">
                                    <span className="w-1.5 h-4 bg-indigo-500 rounded-full"></span>
                                    订单进度 Order Progress
                                </div>
                                <div className="flex items-center gap-1 overflow-x-auto pb-1">
                                    {ORDER_STAGES.map((s, idx) => {
                                        const currentIdx = ORDER_STAGE_KEYS.indexOf(order.stage);
                                        const done = idx <= currentIdx;
                                        const isCurrent = idx === currentIdx;
                                        return (
                                            <div key={s.key} className="flex items-center shrink-0">
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold transition-all ${
                                                    isCurrent ? 'bg-indigo-500 text-white ring-2 ring-indigo-200 pulse-dot' :
                                                    done ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-400'
                                                }`}>
                                                    {done && !isCurrent ? '✓' : idx + 1}
                                                </div>
                                                {idx < ORDER_STAGES.length - 1 && (
                                                    <div className={`w-4 md:w-6 h-0.5 ${idx < currentIdx ? 'bg-green-400' : 'bg-gray-200'}`}></div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex justify-between mt-2">
                                    <span className="text-[10px] text-gray-400">下单</span>
                                    <span className="text-[10px] text-gray-400">完成</span>
                                </div>
                            </div>

                            {/* Production Progress Bar */}
                            {(order.stage === 'Production' || order.stage === 'Deposit_Paid') && (
                                <div className="bg-white rounded-xl border border-gray-100 p-4">
                                    <div className="text-xs font-semibold text-[#233749] mb-3 flex items-center justify-between">
                                        <span className="flex items-center gap-2">
                                            <span className="w-1.5 h-4 bg-purple-500 rounded-full"></span>
                                            生产进度 Production Progress
                                        </span>
                                        {order.stage === 'Production' && <span className="text-[10px] text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded-full">已生产 {daysInProd} 天</span>}
                                    </div>
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className="flex-1 bg-gray-100 rounded-full h-3 overflow-hidden">
                                            <div className="h-full bg-gradient-to-r from-indigo-400 to-purple-500 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                                        </div>
                                        <span className="text-sm font-bold text-[#233749] w-12 text-right">{progress}%</span>
                                    </div>
                                    {order.stage === 'Production' && (
                                        <div className="flex gap-1.5 flex-wrap mt-2">
                                            {[0, 25, 50, 75, 100].map(v => (
                                                <button key={v} onClick={() => handleUpdateProgress(order, v)}
                                                    className={`text-[10px] px-2.5 py-1 rounded-full font-medium transition-colors ${
                                                        progress === v ? 'bg-indigo-500 text-white' : 'bg-gray-100 text-gray-500 hover:bg-indigo-50'
                                                    }`}>
                                                    {v}%
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Order Items */}
                            <div className="bg-white rounded-xl border border-gray-100 p-4">
                                <div className="text-xs font-semibold text-[#233749] mb-3 flex items-center gap-2">
                                    <span className="w-1.5 h-4 bg-amber-500 rounded-full"></span>
                                    产品明细 Order Items ({(order.items || []).length})
                                </div>
                                <div className="space-y-2">
                                    {(order.items || []).map((item, ii) => (
                                        <div key={ii} className="flex items-center justify-between py-2 px-3 bg-[#fcf6fa] rounded-lg">
                                            <div className="min-w-0 flex-1">
                                                <div className="text-sm font-medium text-[#233749] truncate">{item.product}</div>
                                                <div className="text-[10px] text-gray-400 font-mono">{item.sku || 'N/A'}</div>
                                            </div>
                                            <div className="text-right shrink-0 ml-3">
                                                <div className="text-sm font-bold text-[#233749]">x {(item.qty || 0).toLocaleString()}</div>
                                                <div className="text-[10px] text-gray-400">¥{(item.unitPrice || 0).toFixed(2)}/pcs</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between">
                                    <span className="text-xs text-gray-400">合计 Total</span>
                                    <span className="text-base font-bold text-[#233749]">¥{totalAmt.toLocaleString('en', { minimumFractionDigits: 2 })}</span>
                                </div>
                            </div>

                            {/* Production Notes */}
                            <div className="bg-white rounded-xl border border-gray-100 p-4">
                                <div className="text-xs font-semibold text-[#233749] mb-3 flex items-center gap-2">
                                    <span className="w-1.5 h-4 bg-green-500 rounded-full"></span>
                                    生产备注 Production Notes
                                </div>
                                <textarea
                                    value={noteText}
                                    onChange={e => setNoteText(e.target.value)}
                                    rows={3}
                                    placeholder="记录生产进度、问题、特殊要求... Production updates, issues, special requirements..."
                                    className="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-purple-400 resize-none"
                                />
                                <div className="flex justify-end mt-2">
                                    <button onClick={() => handleSaveNote(order)}
                                        className="text-xs font-medium bg-[#233749] text-white px-4 py-1.5 rounded-lg hover:bg-[#233749]/90 transition-colors">
                                        保存备注 Save
                                    </button>
                                </div>
                            </div>

                            {/* Stage History Timeline */}
                            <div className="bg-white rounded-xl border border-gray-100 p-4">
                                <div className="text-xs font-semibold text-[#233749] mb-3 flex items-center gap-2">
                                    <span className="w-1.5 h-4 bg-cyan-500 rounded-full"></span>
                                    状态历史 Stage History
                                </div>
                                {(order.stageHistory || []).length === 0 ? (
                                    <div className="text-xs text-gray-400 text-center py-4">暂无历史记录</div>
                                ) : (
                                    <div className="space-y-0 relative">
                                        <div className="absolute left-[9px] top-2 bottom-2 w-0.5 bg-gray-100"></div>
                                        {[...(order.stageHistory || [])].reverse().map((h, i) => {
                                            const meta = ORDER_STAGE_META[h.stage];
                                            return (
                                                <div key={i} className="flex items-start gap-3 py-1.5 relative">
                                                    <div className={`w-5 h-5 rounded-full flex items-center justify-center shrink-0 z-10 ${i === 0 ? 'bg-indigo-500' : 'bg-gray-200'}`}>
                                                        {meta?.icon ? <Icon name={meta.icon} size={11} className={i === 0 ? 'text-white' : 'text-gray-400'} /> : <div className={`w-2 h-2 rounded-full ${i === 0 ? 'bg-white' : 'bg-gray-400'}`}></div>}
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center justify-between">
                                                            <span className={`text-xs font-medium ${i === 0 ? 'text-[#233749]' : 'text-gray-500'}`}>{meta?.label || h.stage}</span>
                                                            <span className="text-[10px] text-gray-400">{h.date}</span>
                                                        </div>
                                                        {h.by && <div className="text-[10px] text-gray-400 mt-0.5">操作人: {h.by}</div>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* ETA */}
                            {order.estimatedCompletionDate && (
                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center gap-3">
                                    <Icon name="clock" size={20} className="text-amber-600 shrink-0" />
                                    <div>
                                        <div className="text-xs font-semibold text-amber-700">预计完成日期 ETA</div>
                                        <div className="text-sm font-bold text-amber-800">{order.estimatedCompletionDate}</div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Footer Actions */}
                        {canAdvance && (
                            <div className="px-4 md:px-6 py-3 border-t border-gray-100 bg-[#fcf6fa]/50 shrink-0">
                                <button
                                    onClick={() => handleFactoryAdvance(order)}
                                    disabled={updatingStage}
                                    className="w-full bg-indigo-500 hover:bg-indigo-600 disabled:opacity-50 text-white text-sm font-bold py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2">
                                    {updatingStage ? (
                                        <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                                    ) : (
                                        <>
                                            <Icon name={ORDER_STAGE_META[ORDER_STAGE_KEYS[ORDER_STAGE_KEYS.indexOf(order.stage) + 1]]?.icon || 'arrow-right'} size={16} />
                                            推进到: {ORDER_STAGE_META[ORDER_STAGE_KEYS[ORDER_STAGE_KEYS.indexOf(order.stage) + 1]]?.label || '下一步'}
                                        </>
                                    )}
                                </button>
                            </div>
                        )}
                    </div>
                </>
            );
        };

        // Render an order card (used in multiple tabs)
        const renderOrderCard = (order) => {
            const totalAmt = order.totalAmountIncTax || order.totalAmount || (order.items || []).reduce((s, i) => s + (i.qty || 0) * (i.unitPrice || 0), 0);
            const stageMeta = ORDER_STAGE_META[order.stage];
            const progress = order.productionProgress || 0;
            return (
                <div key={order.id}
                    onClick={() => { setSelectedOrder(order); setNoteText(order.productionNote || ''); }}
                    className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden cursor-pointer hover:shadow-md hover:border-purple-200 transition-all active:scale-[0.99]">
                    {/* Card header */}
                    <div className="px-4 py-3 flex items-center justify-between">

    const Pagination = ({ total, pageSize, currentPage, onPageChange }) => {
        const totalPages = Math.ceil(total / pageSize);
        if (totalPages <= 1) return null;

        const getPages = () => {
            const pages = [];
            const maxShow = 5;
            let start = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let end = Math.min(totalPages, start + maxShow - 1);
            if (end - start < maxShow - 1) start = Math.max(1, end - maxShow + 1);
            if (start > 1) { pages.push(1); if (start > 2) pages.push('...'); }
            for (let i = start; i <= end; i++) pages.push(i);
            if (end < totalPages) { if (end < totalPages - 1) pages.push('...'); pages.push(totalPages); }
            return pages;
        };

        return (
            <div className="flex items-center gap-1">
                <button
                    onClick={() => onPageChange(currentPage - 1)}
                    disabled={currentPage <= 1}
                    className="text-xs text-gray-500 hover:text-[#ff8b3d] disabled:text-gray-300 disabled:cursor-not-allowed px-2 py-1 rounded transition-colors"
                >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                {getPages().map((p, i) =>

                            key={p}

                        </button>
                    )
                )}

        return (

    // ========== Price Sparkline (canvas-based mini chart) ==========
    const PriceSparkline = ({ costHistory = [], width = 80, height = 28 }) => {
        const canvasRef = useRef(null);
        useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas || costHistory.length < 2) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, width, height);

            const costs = costHistory.map(h => h.cost);
            const min = Math.min(...costs) * 0.95;
            const max = Math.max(...costs) * 1.05;
            const range = max - min || 1;
            const padX = 2, padY = 3;
            const w = width - padX * 2;
            const h = height - padY * 2;

            // Determine trend for color
            const first = costs[0], last = costs[costs.length - 1];
            const isUp = last > first;
            const isFlat = last === first;
            const lineColor = isFlat ? '#94a3b8' : isUp ? '#fc5466' : '#22c55e';
            const fillColor = isFlat ? 'rgba(148,163,184,0.10)' : isUp ? 'rgba(239,68,68,0.10)' : 'rgba(34,197,94,0.10)';

            const points = costs.map((c, i) => ({
                x: padX + (i / (costs.length - 1)) * w,
                y: padY + h - ((c - min) / range) * h,
            }));

            // Fill area
            ctx.beginPath();
            ctx.moveTo(points[0].x, height);
            points.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.lineTo(points[points.length - 1].x, height);
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();

            // Draw line
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.stroke();

            // End dot
            const endP = points[points.length - 1];
            ctx.beginPath();
            ctx.arc(endP.x, endP.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = lineColor;
            ctx.fill();
        }, [costHistory, width, height]);

        if (!costHistory || costHistory.length < 2) {
            return <span className="text-[10px] text-gray-300 italic">No history</span>;
        }

        const costs = costHistory.map(h => h.cost);
        const first = costs[0], last = costs[costs.length - 1];
        const change = last - first;
        const changePct = first > 0 ? ((change / first) * 100).toFixed(1) : '0.0';
        const isUp = change > 0;
        const isFlat = change === 0;

        return (
            <div className="inline-flex items-center gap-1.5" title={`Price trend: ¥${first.toFixed(2)} → ¥${last.toFixed(2)} (${isUp ? '+' : ''}${changePct}%)`}>
                <canvas ref={canvasRef} style={{ width, height }} className="block" />
                <span className={`text-[9px] font-bold ${isFlat ? 'text-gray-400' : isUp ? 'text-[#fc5466]' : 'text-green-500'}`}>
                    {isFlat ? '—' : isUp ? `↑${changePct}%` : `↓${Math.abs(changePct)}%`}
                </span>
            </div>
        );
    };

    // ========== Factory List View (grouped by category) ==========
    const FactoryListView = ({ factories, products, allOrders, materials, onSelectFactory, showToast }) => {
        const [statusFilter, setStatusFilter] = useState('all');
        const [expandedCats, setExpandedCats] = useState(() => new Set(PRODUCT_CATEGORIES));

        const toggleCat = (cat) => setExpandedCats(prev => {
            const next = new Set(prev);
            next.has(cat) ? next.delete(cat) : next.add(cat);
            return next;
        });

        // Count products per factory
        const productCountMap = useMemo(() => {
            const map = {};
            products.forEach(p => {
                if (p.factoryId) {
                    map[p.factoryId] = (map[p.factoryId] || 0) + 1;
                }
            });
            return map;
        }, [products]);

        // Count orders per factory (based on product SKU matching)
        const orderCountMap = useMemo(() => {
            const factorySkuMap = {};
            products.forEach(p => {
                if (p.factoryId) {
                    if (!factorySkuMap[p.factoryId]) factorySkuMap[p.factoryId] = new Set();
                    factorySkuMap[p.factoryId].add(p.sku);
                }
            });
            const map = {};
            Object.values(allOrders).forEach(orders => {
                orders.forEach(order => {
                    (order.items || []).forEach(item => {
                        Object.entries(factorySkuMap).forEach(([fid, skus]) => {
                            if (skus.has(item.sku)) map[fid] = (map[fid] || 0) + 1;
                        });
                    });
                });
            });
            // Deduplicate: count unique orders not items
            const orderMap = {};
            Object.values(allOrders).forEach(orders => {
                orders.forEach(order => {
                    const matchedFactories = new Set();
                    (order.items || []).forEach(item => {
                        Object.entries(factorySkuMap).forEach(([fid, skus]) => {
                            if (skus.has(item.sku)) matchedFactories.add(fid);
                        });
                    });
                    matchedFactories.forEach(fid => { orderMap[fid] = (orderMap[fid] || 0) + 1; });
                });
            });
            return orderMap;
        }, [products, allOrders]);

        // Filter factories by status
        const filteredFactories = useMemo(() => {
            if (statusFilter === 'all') return factories;
            return factories.filter(f => f.status === statusFilter);
        }, [factories, statusFilter]);

        // Group factories by product category
        const groupedByCategory = useMemo(() => {
            const groups = {};
            PRODUCT_CATEGORIES.forEach(cat => { groups[cat] = []; });
            groups['Other'] = [];
            filteredFactories.forEach(factory => {
                const cats = factory.categories || [];
                if (cats.length === 0) {
                    groups['Other'].push(factory);
                } else {
                    cats.forEach(cat => {
                        if (groups[cat]) groups[cat].push(factory);
                        else groups['Other'].push(factory);
                    });
                }
            });
            return groups;
        }, [filteredFactories]);

        // Status counts
        const statusCounts = useMemo(() => ({
            all: factories.length,
            active: factories.filter(f => f.status === 'active').length,
            paused: factories.filter(f => f.status === 'paused').length,
            pending: factories.filter(f => f.status === 'pending').length,
        }), [factories]);

        return (
            <div className="fade-in space-y-4">
                {/* Stats row */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <StatCard labelZh="工厂总数" label="Total Factories" value={factories.length} sub={`合作中: ${statusCounts.active}`} />
                    <StatCard labelZh="暂停合作" label="Paused" value={statusCounts.paused} color="text-amber-600" />
                    <StatCard labelZh="待恢复" label="Pending Resume" value={statusCounts.pending} color="text-blue-600" />
                    <StatCard labelZh="平均交期" label="Avg Lead Time" value={`${Math.round(factories.reduce((s, f) => s + (parseInt(f.leadTime) || 0), 0) / (factories.length || 1))}天`} color="text-[#233749]" />

                {/* Status filter pills */}
                <div className="flex gap-2 items-center">
                    {[
                        { key: 'all', label: '全部 All' },
                        { key: 'active', label: '合作中 Active' },
                        { key: 'paused', label: '暂停合作 Paused' },
                        { key: 'pending', label: '待恢复 Pending' },

                        <button key={f.key} onClick={() => setStatusFilter(f.key)}

                                statusFilter === f.key
                                    ? 'bg-[#233749] text-white shadow-sm'
                                    : 'bg-white text-gray-500 border border-gray-200 hover:border-[#ff8b3d]/50 hover:text-[#ff8b3d]'
                            }`}>
                            {f.label} ({statusCounts[f.key]})

                    ))}
                </div>

                {/* Category groups */}
                {PRODUCT_CATEGORIES.map(cat => {
                    const catFactories = groupedByCategory[cat] || [];
                    if (catFactories.length === 0) return null;
                    const cm = CATEGORY_META[cat];
                    const isExpanded = expandedCats.has(cat);

                    return (
                        <div key={cat} className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                            {/* Category header */}

                                className="w-full px-5 py-3 flex items-center justify-between hover:bg-[#fcf6fa]/50 transition-colors">
                                <div className="flex items-center gap-2.5">
                                    {cm && <span className={`inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium ring-1 ${cm.cls}`}>{cm.label}</span>}

                            </button>

                            {/* Factory cards grid */}

                                                    <div className="w-9 h-9 rounded-lg bg-[#ff8b3d]/5 flex items-center justify-center group-hover:bg-[#ff8b3d]/10 transition-colors">
                                                        <Icon name="factory" size={18} className="text-gray-500 group-hover:text-[#ff8b3d] transition-colors" />
                                                    </div>
                                                    <div>
                                                        <div className="text-sm font-bold text-[#233749] group-hover:text-[#ff8b3d] transition-colors">{factory.name}</div>
                                                        <div className="text-[10px] text-gray-400">{factory.nameEn}</div>
                                                    </div>
                                                </div>
                                                <FactoryStatusBadge status={factory.status} />
                                            </div>
                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-[10px] mb-2">
                                                <div>
                                                    <span className="text-gray-400">产品 Products</span>
                                                    <div className="font-bold text-[#233749]">{productCountMap[factory.id] || 0}</div>
                                                </div>
                                                <div>
                                                    <span className="text-gray-400">订单 Orders</span>
                                                    <div className="font-bold text-[#233749]">{orderCountMap[factory.id] || 0}</div>
                                                </div>
                                                <div>
                                                    <span className="text-gray-400">交期 Lead</span>
                                                    <div className="font-bold text-[#233749]">{factory.leadTime}</div>
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-1.5">
                                                    <span className="text-[10px] text-gray-400"><Icon name="map-pin" size={10} className="inline" /> {factory.location}</span>
                                                </div>
                                                <span className="text-[10px] text-gray-400">{'★'.repeat(factory.rating || 0)}{'☆'.repeat(5 - (factory.rating || 0))}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                })}

                {/* "Other" group if any */}
                {(groupedByCategory['Other'] || []).length > 0 && (
                    <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                        <div className="px-5 py-3 border-b border-gray-100">

                        <div className="px-5 pb-4 pt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
                            {groupedByCategory['Other'].map(factory => (
                                <div key={factory.id} onClick={() => onSelectFactory(factory.id)}
                                    className="border border-gray-100 rounded-xl p-4 hover:shadow-md hover:border-[#ff8b3d]/30 transition-all cursor-pointer">

                                        <span className="text-sm font-bold text-[#233749]">{factory.name}</span>
                                        <FactoryStatusBadge status={factory.status} />

                                    <div className="text-[10px] text-gray-400">{factory.location} · {factory.leadTime}</div>
